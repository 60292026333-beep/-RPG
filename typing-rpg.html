<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ハイブリッド・タイピングRPG</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: monospace;
  }
  #gameCanvas {
    display: block;
    image-rendering: pixelated;
    border: 2px solid #444;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
// ===== キャンバス =====
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 640, H = 480;
canvas.width = W;
canvas.height = H;

let mode = 'title'; // 'title'|'howtoplay'|'field'|'flash'|'battle'|'victory'|'gameover'|'gameclear'

// ===== リトライフェードイン演出 =====
// ゲームオーバー後のセーブデータ復帰時に暗転→フィールドへじわっと戻す
const retryFade = {
  active: false,
  timer:  0,
  duration: 90, // 1.5秒（60fps）
};
const BOSS_EVENT = {
  tx: 10, ty: 10,         // マップ上のボス固定座標（左端火山エリア内）
  isDefeated: false,      // 撃破済みフラグ（ゲームクリア条件）
  isNear: false,          // プレイヤーが接近中フラグ（UI表示用）
  triggerRadius: 0.8,     // エンカウントトリガー半径（タイル）
};

// ゲームクリア画面用タイマー
let gameclearTimer = 0;

// ===== アイソメトリック定数 =====
const TW = 40, TH = 40;  // トップダウン：正方形タイル
const MAP_W = 80, MAP_H = 80;

// ===== 座標変換：トップダウン（真上視点） =====
// タイルを正方形グリッドで並べる
// camX/camY はワールド空間でのカメラ左上基点（ピクセル単位）
function isoToScreen(tx, ty, camX, camY) {
  return {
    sx: tx * TW - camX,
    sy: ty * TH - camY,
  };
}

// ===== バイオーム定義 =====
// 0=平原 1=森 2=砂漠 3=雪原 4=火山 5=湿地 6=海岸
const BIOME = { PLAIN:0, FOREST:1, DESERT:2, SNOW:3, VOLCANO:4, SWAMP:5, COAST:6 };

const BIOME_INFO = [
  { name:'平原',  encRate:0.8 },
  { name:'森',    encRate:1.2 },
  { name:'砂漠',  encRate:1.0 },
  { name:'雪原',  encRate:1.0 },
  { name:'火山',  encRate:1.4 },
  { name:'湿地',  encRate:1.1 },
  { name:'海岸',  encRate:0.7 },
];

// ===== タイル定義 =====
// tileId → [biome, variant]
// 平原:  0=草,1=濃草  森: 10=林床,11=苔  砂漠: 20=砂,21=岩砂
// 雪原:  30=雪,31=氷  火山: 40=溶岩地,41=黒岩  湿地: 50=泥,51=沼水
// 海岸:  60=砂浜,61=浅瀬  水(共通): 70
const TILE_DEF = {
   0: { top:'#5AB86C', lft:'#3A7A45', rgt:'#4A9A58' },  // 平原・草
   1: { top:'#3A8A48', lft:'#1E5A2A', rgt:'#2E7038' },  // 平原・濃草
  10: { top:'#4A7A35', lft:'#2E5020', rgt:'#3A6028' },  // 森・林床
  11: { top:'#3A6A2A', lft:'#204018', rgt:'#2A5020' },  // 森・苔
  20: { top:'#D4B96A', lft:'#9A8040', rgt:'#B89A50' },  // 砂漠・砂
  21: { top:'#B89850', lft:'#806830', rgt:'#9A7840' },  // 砂漠・岩砂
  30: { top:'#E8EEF8', lft:'#A0AABF', rgt:'#C0C8D8' },  // 雪原・雪
  31: { top:'#C8D8F0', lft:'#88A0C0', rgt:'#A0B8D8' },  // 雪原・氷
  40: { top:'#3A2015', lft:'#1A1008', rgt:'#2A1810' },  // 火山・黒岩
  41: { top:'#4A2810', lft:'#281408', rgt:'#381C0C' },  // 火山・焦岩
  50: { top:'#4A5A30', lft:'#2A3818', rgt:'#384828' },  // 湿地・泥
  51: { top:'#2A5040', lft:'#183028', rgt:'#204038' },  // 湿地・沼
  60: { top:'#D8C080', lft:'#988048', rgt:'#B09060' },  // 海岸・砂浜
  61: { top:'#60A8C0', lft:'#388090', rgt:'#4890A8' },  // 海岸・浅瀬
  70: null, // 水(特殊描画)
  71: null, // 溶岩(特殊描画)
  80: { top:'#9A9080', lft:'#6A6058', rgt:'#807870' },  // 石畳（村広場）
};

// ===== マップデータ =====
const mapTiles   = []; // [y][x] = tileId
const mapBiome   = []; // [y][x] = biomeId
const mapObjects = []; // {tx,ty,type,biome}
const mapTowns   = []; // {tx,ty,type:'village'|'inn', name, biome} 村・宿リスト

function generateMap() {
  // シンプルなノイズでバイオームゾーンを分割
  let seed = 99887;
  function rng() {
    seed = (seed * 1664525 + 1013904223) & 0xffffffff;
    return (seed >>> 0) / 0xffffffff;
  }

  // ===== ノイズグリッド =====
  // CELL を大きくすることでノイズの波長を伸ばし、
  // バイオームが大きな塊として現れるようにする
  const CELL = 40; // 旧: 10 → 4倍の波長（1塊がマップの半分規模）
  const gw = Math.ceil(MAP_W / CELL) + 2;
  const gh = Math.ceil(MAP_H / CELL) + 2;

  // グリッド生成ヘルパー
  function makeGrid() {
    const g = [];
    for (let gy = 0; gy < gh; gy++) {
      g[gy] = [];
      for (let gx = 0; gx < gw; gx++) g[gy][gx] = rng();
    }
    return g;
  }

  // Smoothstep バイリニア補間
  function sampleGrid(g, x, y) {
    const gx  = Math.floor(x / CELL), gy  = Math.floor(y / CELL);
    const fx  = (x % CELL) / CELL,   fy  = (y % CELL) / CELL;
    const fx2 = fx * fx * (3 - 2 * fx);
    const fy2 = fy * fy * (3 - 2 * fy);
    const a = g[gy][gx],     b = g[gy][gx + 1];
    const c = g[gy + 1][gx], d = g[gy + 1][gx + 1];
    return a*(1-fx2)*(1-fy2) + b*fx2*(1-fy2) + c*(1-fx2)*fy2 + d*fx2*fy2;
  }

  // ノイズ2種（高度・温度）をそれぞれ別のグリッドで生成
  const gridH = makeGrid(); // 高度ノイズ（陸・海・高地を決める）
  const gridT = makeGrid(); // 温度ノイズ（暑さ・寒さを決める）

  // ===== タイル・バイオーム生成 =====
  for (let y = 0; y < MAP_H; y++) {
    mapTiles[y] = [];
    mapBiome[y] = [];

    // 緯度バイアス：
    //   北端(y=0)  → latBias=-0.425  温度を下げる（雪原・火山寄り）
    //   中央(y=40) → latBias= 0      バイアスなし
    //   南端(y=79) → latBias=+0.425  温度を上げる（砂漠・海岸寄り）
    const latBias = ((y / (MAP_H - 1)) - 0.5) * 0.85;

    for (let x = 0; x < MAP_W; x++) {
      const r = rng();
      // 高度・温度ノイズを取得し、緯度バイアスを温度に加算
      const h = sampleGrid(gridH, x, y);               // 0〜1
      const t = Math.min(1, Math.max(0,
                  sampleGrid(gridT, x, y) + latBias));  // 0〜1（クランプ）

      // ===== バイオーム決定 =====
      //
      // 【設計方針】
      // ・湿地を h < 0.42 → h < 0.32 に縮小し、低地でも森・平原が出やすくなるよう調整
      // ・平原の温度上限を t > 0.65 → t > 0.68 に引き上げ、中温帯を森に割り当てる
      // ・森の高度上限を h < 0.72 → h < 0.78 に広げ、広大な大森林を実現
      //
      // 【砂漠の境界線ぼかし】
      //  従来の「y > MAP_H*0.80」は水平直線になって不自然だったため、
      //  高度ノイズ h（0〜1）を境界ラインに加算して凸凹させる。
      //    desertEdge = MAP_H * 0.78 + h * 8
      //  hが高い（高地）ほど境界が北寄りにずれ、低地ほど南寄りになる。
      //  ±8タイル（= h*8）の揺らぎで、ジグザグした有機的な境界が生まれる。
      //  さらに温度条件も残すことで、境界付近に砂漠・平原が混在したグラデーションを作る。
      //
      // 1. 海岸  : h < 0.22  （最優先・水辺）
      // 2. 雪原  : t < 0.35
      // 3. 火山  : t < 0.52 && h > 0.42
      // 4. 砂漠  : y > MAP_H*0.78 + h*8 かつ t > 0.65  （高度ノイズで境界をジグザグ化）
      // 5. 湿地  : h < 0.32  （旧: h<0.42 → 縮小。低地のみに限定）
      // 6. 平原  : t > 0.68  （旧: t>0.65 → 中温帯を森に解放）
      // 7. 森    : h < 0.78  （旧: h<0.72 → 大幅拡大）
      // 8. default: 平原
      let biome;
      if      (h < 0.22)                                     biome = BIOME.COAST;
      else if (t < 0.35)                                     biome = BIOME.SNOW;
      else if (t < 0.52 && h > 0.42)                        biome = BIOME.VOLCANO;
      else if (y > MAP_H * 0.78 + h * 8 && t > 0.65)       biome = BIOME.DESERT;
      else if (h < 0.32)                                     biome = BIOME.SWAMP;
      else if (t > 0.68)                                     biome = BIOME.PLAIN;
      else if (h < 0.78)                                     biome = BIOME.FOREST;
      else                                                   biome = BIOME.PLAIN;

      // ===== 左端エリア：雪原 → 火山への強制上書き =====
      // x < MAP_W*0.25（0〜19列）：雪原を火山に完全置換
      // x < MAP_W*0.30（20〜23列）：グラデーションゾーン（右に行くほど置換確率が下がる）
      // 水タイル・その他バイオームは変更しない
      if (biome === BIOME.SNOW) {
        const hardEdge  = MAP_W * 0.25; // 完全置換ライン（x < 20）
        const blendEdge = MAP_W * 0.30; // グラデーション終端（x < 24）
        if (x < hardEdge) {
          biome = BIOME.VOLCANO;
        } else if (x < blendEdge) {
          // 境界から右に離れるほど確率が下がる線形ブレンド
          const prob = 1 - (x - hardEdge) / (blendEdge - hardEdge);
          if (r < prob) biome = BIOME.VOLCANO;
        }
      }

      mapBiome[y][x] = biome;

      // ===== タイルID決定（バイオームに応じて選択） =====
      let tileId;
      if      (h < 0.22)                 tileId = 70; // 深海
      else if (biome === BIOME.COAST)    tileId = h < 0.26 ? 61 : (r < 0.6 ? 60 : 61);
      else if (biome === BIOME.PLAIN)    tileId = r < 0.65 ? 0 : 1;
      else if (biome === BIOME.FOREST)   tileId = r < 0.6  ? 10 : 11;
      else if (biome === BIOME.DESERT)   tileId = r < 0.7  ? 20 : 21;
      else if (biome === BIOME.SNOW)     tileId = r < 0.65 ? 30 : 31;
      else if (biome === BIOME.VOLCANO)  tileId = h > 0.82 ? 71 : (r < 0.6 ? 40 : 41);
      else if (biome === BIOME.SWAMP)    tileId = r < 0.55 ? 50 : 51;
      else                               tileId = 0;

      mapTiles[y][x] = tileId;
    }
  }

  // オブジェクト配置
  const startX = Math.floor(MAP_W/2), startY = Math.floor(MAP_H/2);
  for (let y = 1; y < MAP_H-1; y++) {
    for (let x = 1; x < MAP_W-1; x++) {
      const tid = mapTiles[y][x];
      if (tid === 70 || tid === 71) continue;
      if (Math.abs(x-startX)<4 && Math.abs(y-startY)<4) continue;
      const r = rng();
      const biome = mapBiome[y][x];
      if (biome === BIOME.PLAIN   && r < 0.04) mapObjects.push({tx:x,ty:y,type:'tree'});
      else if (biome === BIOME.PLAIN && r < 0.06) mapObjects.push({tx:x,ty:y,type:'rock'});
      else if (biome === BIOME.FOREST && r < 0.12) mapObjects.push({tx:x,ty:y,type:'tree'});
      else if (biome === BIOME.FOREST && r < 0.14) mapObjects.push({tx:x,ty:y,type:'bigrock'});
      else if (biome === BIOME.DESERT && r < 0.05) mapObjects.push({tx:x,ty:y,type:'cactus'});
      else if (biome === BIOME.DESERT && r < 0.08) mapObjects.push({tx:x,ty:y,type:'rock'});
      else if (biome === BIOME.SNOW   && r < 0.06) mapObjects.push({tx:x,ty:y,type:'snowtree'});
      else if (biome === BIOME.SNOW   && r < 0.09) mapObjects.push({tx:x,ty:y,type:'icerock'});
      else if (biome === BIOME.VOLCANO&& r < 0.05) mapObjects.push({tx:x,ty:y,type:'lavarock'});
      else if (biome === BIOME.SWAMP  && r < 0.07) mapObjects.push({tx:x,ty:y,type:'deadtree'});
      else if (biome === BIOME.COAST  && r < 0.03) mapObjects.push({tx:x,ty:y,type:'palmtree'});
    }
  }

  // ===== 村・宿の配置 =====
  // バイオームごとに名前リストを持つ
  const VILLAGE_NAMES = {
    [BIOME.PLAIN]:   ['グリーンヘイム', 'リーフタウン',  'サニーグレン'],
    [BIOME.FOREST]:  ['モスウッド',     'エルダーグロブ','フェアリーホロウ'],
    [BIOME.DESERT]:  ['サンドポスト',   'オアシスエッジ','デューンズレスト'],
    [BIOME.SNOW]:    ['フロストホルム', 'アイスピーク',  'ウィンターベール'],
    [BIOME.VOLCANO]: ['アッシュフォード','エンバーキープ','クレーターゲート'],
    [BIOME.SWAMP]:   ['マードウォーター','ボグトン',     'リードハロウ'],
    [BIOME.COAST]:   ['タイドハーバー', 'シェルコーブ',  'マリンブレイク'],
  };
  const INN_NAMES = {
    [BIOME.PLAIN]:   ['旅人の宿　ヘイ'],
    [BIOME.FOREST]:  ['森の隠れ宿'],
    [BIOME.DESERT]:  ['砂漠のオアシス亭'],
    [BIOME.SNOW]:    ['雪原の暖炉宿'],
    [BIOME.VOLCANO]: ['溶岩の宿場'],
    [BIOME.SWAMP]:   ['沼地の浮き宿'],
    [BIOME.COAST]:   ['波音の宿　海辺'],
  };

  // 各バイオームに村2〜3か所、宿1〜2か所を分散配置
  // 16×16のゾーン分割で各ゾーンに1施設まで
  const ZONE = 16;
  const usedZones = new Set();

  function tryPlaceTown(type, nameTable) {
    for (let attempt = 0; attempt < 200; attempt++) {
      const x = 2 + Math.floor(rng() * (MAP_W - 4));
      const y = 2 + Math.floor(rng() * (MAP_H - 4));
      const tid = mapTiles[y]?.[x];
      if (!tid || tid === 70 || tid === 71) continue;
      // スタート付近を除外
      if (Math.abs(x - startX) < 5 && Math.abs(y - startY) < 5) continue;
      // ゾーン重複チェック（施設同士が近すぎないように）
      // attempt > 150 のときはゾーン重複を許容（砂漠など狭バイオームでの全滅を防ぐ）
      const zoneKey = `${Math.floor(x/ZONE)}_${Math.floor(y/ZONE)}`;
      if (attempt < 150 && usedZones.has(zoneKey)) continue;
      // 既存オブジェクトと重複しないよう除外
      const tooClose = mapObjects.some(o => Math.hypot(o.tx-x, o.ty-y) < 2) ||
                       mapTowns.some(t => Math.hypot(t.tx-x, t.ty-y) < 6);
      if (tooClose) continue;

      const biome = mapBiome[y][x];
      const names = nameTable[biome] || nameTable[BIOME.PLAIN];
      const name  = names[Math.floor(rng() * names.length)];
      mapTowns.push({ tx:x, ty:y, type, name, biome });
      usedZones.add(zoneKey);

      // 建物周囲を「石畳」風に上書き（tileId=80）して広場を作る
      // 安全圏（半径2.8）に視覚的に対応するよう 5×5 に拡張。
      // 中心1マスは建物タイルなので変えない。水・溶岩タイルも変えない。
      for (let dy2 = -2; dy2 <= 2; dy2++) {
        for (let dx2 = -2; dx2 <= 2; dx2++) {
          const nx2=x+dx2, ny2=y+dy2;
          if (nx2<0||ny2<0||nx2>=MAP_W||ny2>=MAP_H) continue;
          if (mapTiles[ny2][nx2]===70||mapTiles[ny2][nx2]===71) continue;
          if (dx2===0&&dy2===0) continue; // 建物タイル自体は変えない
          mapTiles[ny2][nx2] = 80; // 石畳
        }
      }
      return true;
    }
    return false;
  }

  // 村を10か所程度
  for (let i = 0; i < 10; i++) tryPlaceTown('village', VILLAGE_NAMES);
  // 宿を8か所程度
  for (let i = 0; i < 8;  i++) tryPlaceTown('inn',     INN_NAMES);

  // ===== ボス周囲 3×3 を火山タイルに強制塗り替え =====
  // 座標(BOSS_EVENT.tx, BOSS_EVENT.ty)が確実に火山バイオーム上に存在するよう保証する。
  // 水タイル(70/71)のみ例外として変更しない。
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      const bx = BOSS_EVENT.tx + dx;
      const by = BOSS_EVENT.ty + dy;
      if (bx < 0 || by < 0 || bx >= MAP_W || by >= MAP_H) continue;
      if (mapTiles[by][bx] === 70 || mapTiles[by][bx] === 71) continue;
      mapBiome[by][bx] = BIOME.VOLCANO;
      mapTiles[by][bx] = 40; // 火山・黒岩
    }
  }

  // ===== ボス周囲 溶岩お堀（半径3〜4タイルの円状溶岩リング） =====
  // Math.hypot で円形判定し、自然な曲線の堀を作る。
  // 入口（プレイヤーが入れるよう南東方向）は意図的に空ける。
  const MOAT_INNER = 2.8; // 内径
  const MOAT_OUTER = 4.2; // 外径
  for (let dy = -5; dy <= 5; dy++) {
    for (let dx = -5; dx <= 5; dx++) {
      const dist = Math.hypot(dx, dy);
      if (dist < MOAT_INNER || dist > MOAT_OUTER) continue;
      // 入口：南東方向（dx>0かつdy>0）の1タイル幅を空ける
      if (dx >= 2 && dy >= 2 && dx + dy <= 6) continue;
      const bx = BOSS_EVENT.tx + dx;
      const by = BOSS_EVENT.ty + dy;
      if (bx < 0 || by < 0 || bx >= MAP_W || by >= MAP_H) continue;
      mapTiles[by][bx] = 71; // 溶岩
      mapBiome[by][bx] = BIOME.VOLCANO;
    }
  }

  // ===== ボス周囲の障害物クレンジング（スタック防止） =====
  // 堀の外径+1タイルまでの範囲（半径5タイル以内）のオブジェクトをすべて除去する。
  // demon_castle は後で手動追加するので除去しない（存在しない時点で実行するので問題なし）。
  const CLEAR_RADIUS = 5;
  for (let i = mapObjects.length - 1; i >= 0; i--) {
    const o = mapObjects[i];
    if (Math.hypot(o.tx - BOSS_EVENT.tx, o.ty - BOSS_EVENT.ty) <= CLEAR_RADIUS) {
      mapObjects.splice(i, 1);
    }
  }

  // ===== 魔王城オブジェクトを配置 =====
  // Zソートに乗るよう mapObjects に登録する。
  // 描画は drawIsoObject 内の 'demon_castle' ケースで行う。
  mapObjects.push({ tx: BOSS_EVENT.tx, ty: BOSS_EVENT.ty, type: 'demon_castle' });
}
generateMap();

// スタート位置を陸地に補正
{
  let sx = Math.floor(MAP_W/2), sy = Math.floor(MAP_H/2);
  outer: for (let r = 0; r < 20; r++) {
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      const tx = sx+dx, ty = sy+dy;
      if (tx<0||ty<0||tx>=MAP_W||ty>=MAP_H) continue;
      const tid = mapTiles[ty][tx];
      if (tid !== 70 && tid !== 71) { sx = tx; sy = ty; break outer; }
    }
  }
  var START_X = sx, START_Y = sy;
}

// ===== セーブ通知（フィールド上のフローティングメッセージ） =====
const saveNotify = {
  msg:   '',   // 表示するテキスト
  timer: 0,    // 残りフレーム数（0 で非表示）
};
const SAVE_NOTIFY_DURATION = 120; // 2秒（60fps × 2）

// ===== フィールド状態 =====
const field = {

// インベントリ操作
function addItem(itemId, qty=1) {
  const slot = player.inventory.find(s => s.itemId === itemId);
  if (slot) slot.qty += qty;
  else player.inventory.push({ itemId, qty });
}
function removeItem(itemId, qty=1) {
  const idx = player.inventory.findIndex(s => s.itemId === itemId);
  if (idx < 0) return false;
  player.inventory[idx].qty -= qty;
  if (player.inventory[idx].qty <= 0) player.inventory.splice(idx, 1);
  return true;
}
function getItemQty(itemId) {
  const slot = player.inventory.find(s => s.itemId === itemId);
  return slot ? slot.qty : 0;
}

// アイテム使用
function useItem(itemId) {
  const m = ITEM_MASTER[itemId];
  if (!m) return null;
  if (!removeItem(itemId)) return null;
  if (m.type === 'heal')   { const v=Math.min(player.maxHp,player.hp+m.value)-player.hp; player.hp+=v; return m.name+'を つかった！ HP+'+v; }
  if (m.type === 'mpHeal') { const v=Math.min(player.maxMp,player.mp+m.value)-player.mp; player.mp+=v; return m.name+'を つかった！ MP+'+v; }
  if (m.type === 'full')   { player.hp=player.maxHp; player.mp=player.maxMp; return m.name+'！ HP・MP かんぜんかいふく！'; }
  if (m.type === 'atkUp')  { if (typeof battle !== 'undefined') battle.atkBuff=(battle.atkBuff||0)+m.value/10; return m.name+'！ こうげきりょく アップ！(次の戦闘で有効)'; }
  return null;
}

function expToNext(lv) { return lv * 15; }

let lastStatGain    = { hp:0, mp:0, atk:0, def:0 };
let lastLearnedSkills = []; // 今回のレベルアップで習得した技のid配列

function tryLevelUp() {
  let n = 0;
  lastStatGain     = { hp:0, mp:0, atk:0, def:0 };
  lastLearnedSkills = [];

  while (player.exp >= expToNext(player.lv)) {
    player.exp -= expToNext(player.lv);
    player.lv++;

    // ── ステータス上昇 ──
    const hpUp  = 8 + Math.floor(player.lv * 1.5);
    const mpUp  = 4 + Math.floor(player.lv * 0.8);
    const atkUp = 2 + Math.floor(player.lv * 0.5);
    const defUp = 1;
    player.maxHp += hpUp; player.maxMp += mpUp;
    player.atk   += atkUp; player.def  += defUp;
    player.hp = player.maxHp; player.mp = player.maxMp;
    lastStatGain.hp  += hpUp; lastStatGain.mp  += mpUp;
    lastStatGain.atk += atkUp; lastStatGain.def += defUp;

    // ── 技習得チェック：現在のLvに対応するエントリを走査 ──
    // whileで1レベルずつ処理するため飛び級しても漏れなし
    for (const entry of LEARN_MASTER) {
      if (entry.lv !== player.lv) continue;
      if (entry.type === 'attack') {
        if (!player.learnedAttacks.includes(entry.id)) {
          player.learnedAttacks.push(entry.id);
          lastLearnedSkills.push(entry.id);
        }
      } else if (entry.type === 'magic') {
        if (!player.learnedMagics.includes(entry.id)) {
          player.learnedMagics.push(entry.id);
          lastLearnedSkills.push(entry.id);
        }
      }
    }
    n++;
  }
  return n;
}

// ===== 入力ハンドラ =====
function onKeyDown(key) {
  // ===== タイトル画面 =====
  if (mode === 'title') {
    const hasSave = hasSaveData();
    // 表示項目数（セーブあり:3、セーブなし:2）
    const itemCount = hasSave ? 3 : 2;

    if (key === 'ArrowUp' || key === 'ArrowDown' || key === 'w' || key === 's') {
      const dir = (key === 'ArrowDown' || key === 's') ? 1 : -1;
      title.cursor = (title.cursor + dir + itemCount) % itemCount;
    }
    if (key === 'Enter' || key === ' ') {
      // セーブなし時: 0=はじめから, 1=あそびかた
      // セーブあり時: 0=はじめから, 1=つづきから, 2=あそびかた
      const isHowTo = title.cursor === (hasSave ? 2 : 1);
      const isContinue = hasSave && title.cursor === 1;

      if (isHowTo) {
        // あそびかた
        mode = 'howtoplay';
        bgmSyncToMode('howtoplay');
      } else if (isContinue) {
        // つづきから
        if (!loadGame()) {
          resetGame();
          mode = 'field';
          bgmSyncToMode('field');
        }
      } else {
        // はじめから
        deleteSaveData();
        resetGame();
        mode = 'field';
        bgmSyncToMode('field');
      }
    }
    return;
  }

  // ===== あそびかた画面 =====
  if (mode === 'howtoplay') {
    if (key === 'Enter' || key === ' ' || key === 'Escape') {
      mode = 'title';
    }
    return;
  }

  // ===== ゲームクリア画面 =====
  if (mode === 'gameclear') {
    if ((key === 'Enter' || key === ' ') && gameclearTimer > 450) {
      title.cursor = 0;
      title.animTimer = 0;
      mode = 'title';
      bgmSyncToMode('title');
    }
    return;
  }

  if (mode === 'field') {
    // ショップが開いている場合
    if (shop.active) {
      if (shop.messageTimer > 0) return;
      const list = getShopList();
      if (key === 'ArrowLeft')  { shop.tab = (shop.tab + 2) % 3; shop.cursor = 0; }
      if (key === 'ArrowRight') { shop.tab = (shop.tab + 1) % 3; shop.cursor = 0; }
      if (key === 'ArrowUp')    shop.cursor = (shop.cursor - 1 + list.length) % list.length;
      if (key === 'ArrowDown')  shop.cursor = (shop.cursor + 1) % list.length;
      if (key === 'Escape' || key === 'x' || key === 'X') { shop.active = false; }
      if (key === 'Enter' || key === ' ') {
        const item = list[shop.cursor];
        if (!item) return;
        if (player.coins < item.price) {
          shop.message = 'コインが たりない！'; shop.messageTimer = 80;
        } else {
          player.coins -= item.price;
          if (item.mtype === 'weapon') {
            addItem(item.id);
            player.equip.weapon = item.id;
            shop.message = item.name + 'を かって そうびした！';
          } else if (item.mtype === 'armor') {
            addItem(item.id);
            player.equip.armor = item.id;
            shop.message = item.name + 'を かって そうびした！';
          } else {
            addItem(item.id);
            shop.message = item.name + 'を かった！';
          }
          shop.messageTimer = 90;
        }
      }
      return;
    }
    // フィールドメニューが開いている場合
    if (fieldMenu.active) {
      handleFieldMenuInput(key);
      return;
    }
    // 施設メニューが開いている場合
    if (townMenu.active) {
      if (townMenu.messageTimer > 0) return;
      const opts = getTownOptions(townMenu.town);
      if (key === 'ArrowUp') {
        townMenu.cursor = (townMenu.cursor - 1 + opts.length) % opts.length;
      } else if (key === 'ArrowDown') {
        townMenu.cursor = (townMenu.cursor + 1) % opts.length;
      } else if (key === 'Enter' || key === ' ') {
        useTownOption(townMenu.town, opts[townMenu.cursor].action);
      }
      return;
    }
    // Sキーで手動セーブ（ショップ・メニュー非表示時のみ）
    if ((key === 's' || key === 'S') && !shop.active && !fieldMenu.active && !townMenu.active) {
      const ok = saveGame();
      saveNotify.msg   = ok ? '💾 セーブしました' : '❌ セーブに失敗しました';
      saveNotify.timer = SAVE_NOTIFY_DURATION;
      return;
    }
    // Bキーで BGM ON/OFF トグル（どのメニュー状態でも有効）
    if (key === 'b' || key === 'B') {
      bgm.enabled = !bgm.enabled;
      if (bgm.enabled) {
        bgmSyncToMode(mode); // 現在の mode に合わせて再開
        saveNotify.msg = '🎵 BGM ON';
      } else {
        bgmStop();
        saveNotify.msg = '🔇 BGM OFF';
      }
      saveNotify.timer = SAVE_NOTIFY_DURATION;
      return;
    }
    // Mキーでフィールドメニューを開く
    if (key === 'm' || key === 'M') {
      fieldMenu.active = true; fieldMenu.tab = 0; fieldMenu.cursor = 0; fieldMenu.message = '';
      return;
    }
    // 施設に近い場合、Enterでメニューを開く
    const nearTown = getNearbyTown();
    if ((key === 'Enter' || key === ' ') && nearTown) {
      townMenu.active = true;
      townMenu.town = nearTown;
      townMenu.cursor = 0;
      townMenu.message = '';
      townMenu.messageTimer = 0;
    }
    // ボスに近い場合、Enterでボス戦開始
    if ((key === 'Enter' || key === ' ') && BOSS_EVENT.isNear && !BOSS_EVENT.isDefeated) {
      startBossFlash();
    }
  } else if (mode === 'battle') {
    handleBattleInput(key);
  } else if (mode === 'victory' || mode === 'gameover') {
    if (key === 'Enter' || key === ' ') {
      if (mode === 'victory') {
        mode = 'field'; field.stepCount = 0; player.hp = player.maxHp;
        bgmSyncToMode('field');
      } else {
        // ゲームオーバー → セーブデータがあればリトライ、なければタイトルへ
        if (hasSaveData()) {
          // セーブデータから復帰
          if (loadGame()) {
            retryFade.active = true;
            retryFade.timer  = 0;
            // BGMはフェード完了後に bgmSyncToMode('field') するため
            // フェードイン中は無音にする（bgmStop は loadGame 内でリセット済み）
            bgmStop();
          } else {
            // ロード失敗時はタイトルへ
            resetGame();
            title.cursor = 0; title.animTimer = 0;
            mode = 'title';
            bgmSyncToMode('title');
          }
        } else {
          // セーブなし → タイトルへ戻る
          resetGame();
          title.cursor = 0; title.animTimer = 0;
          mode = 'title';
          bgmSyncToMode('title');
        }
      }
    }
  }
}

function startFlash() { mode='flash'; flash.timer=0; flash.phase=0; bgmSyncToMode('flash'); }
function startBossFlash() { mode='flash'; flash.timer=0; flash.phase=0; flash.isBoss=true; bgmSyncToMode('flash'); }

function getCurrentBiome() {
  const tx=Math.round(field.px), ty=Math.round(field.py);
  if (tx<0||ty<0||tx>=MAP_W||ty>=MAP_H) return BIOME.PLAIN;
  return mapBiome[ty][tx];
}

function startBattle() {
  const biome = getCurrentBiome();
  const table = ENEMY_TABLE[biome] || ENEMY_TABLE[BIOME.PLAIN];
  const tmpl  = table[Math.floor(Math.random()*table.length)];
  const lv=player.lv, scale=1+(lv-1)*0.3;
  enemy = {
    ...tmpl,
    lv, maxHp:Math.round(tmpl.hp*scale),
    hp:Math.round(tmpl.hp*scale),
    atk:Math.round(tmpl.atk*scale),
    def:Math.round(tmpl.def*scale),
    status:      null, // null | 'poison' | 'paralysis' | 'burn' | 'freeze' | 'shock'
    statusTurns: 0,
    burnDmg:     0,    // 炎: 毎ターンの持続ダメージ量
    freezeDefMod:0,    // 氷: 凍結中の防御力補正（例: 0.7 = 30%減）
  };
  battle.phase='command'; battle.commandCursor=0;
  battle.menuLevel=0; battle.categoryCursor=0; battle.subCursor=0;
  battle.atkBuff=0; battle.clockdownBuff=false; battle.currentCmd='';
  battle.biome = biome; battle.isBossBattle = false;
  battle.message=tmpl.name+'(Lv'+lv+')があらわれた！';
  battle.messageTimer=battle.messageDuration;
  lastExpGain=0; lastLevelUp=0; lastCoinGain=0;
  lastStatGain={hp:0,mp:0,atk:0,def:0};
  mode='battle';
  bgmSyncToMode('battle');
}

/** ボス（タイピング魔王）戦を開始する */

    def:   20,
    baseExp:  2000,
    coinDrop: 2000,
    status:      null,
    statusTurns: 0,
    burnDmg:     0,

  };

  battle.menuLevel=0; battle.categoryCursor=0; battle.subCursor=0;

  battle.biome = BIOME.VOLCANO; battle.isBossBattle = true;

function handleBattleInput(key) {
  if (battle.phase==='command') {
    if (battle.messageTimer>0) return;

    if (battle.menuLevel===0) {
      // カテゴリ選択（こうげき系 / じゅもん系）
      if (key==='ArrowUp'||key==='ArrowDown')
        battle.categoryCursor = battle.categoryCursor===0?1:0;
      if (key==='Enter'||key===' ') {
        battle.menuLevel = 1;
        battle.subCursor  = 0;
      }
    } else {
      // サブコマンド選択
      const list = battle.categoryCursor===0 ? getLearnedAttackCmds() : getLearnedMagicCmds();
      if (key==='ArrowUp')
        battle.subCursor = (battle.subCursor - 1 + list.length) % list.length;
      if (key==='ArrowDown')
        battle.subCursor = (battle.subCursor + 1) % list.length;
      if (key==='Escape'||key==='x'||key==='X') {
        // カテゴリ選択に戻る
        battle.menuLevel = 0;
      }
      if (key==='Enter'||key===' ') {
        startTyping(list[battle.subCursor].id);
      }
    }
  } else if (battle.phase==='typing') {
    if (key.length===1) {
      const t=battle.typingTarget, i=battle.typingIndex;
      if (i<t.length && key===t[i]) {
        battle.typingIndex++;
        if (battle.typingIndex>=t.length) {
          seTypingSuccess(); // 全文字入力完了
          finishTyping(true);
        } else {
          seTypingKey();     // 1文字正解
        }
      }
      // 誤入力時は無音（ストレスを与えすぎない設計）
    }
  }
}

function startTyping(cmd) {
  const word=typingWords[cmd];
  if (word.mpCost>0 && player.mp<word.mpCost) {
    battle.message='MPが たりない！ (必要: '+word.mpCost+')';
    battle.messageTimer=battle.messageDuration;
    return;
  }
  battle.typingWord=word.display; battle.typingTarget=word.roman;
  battle.typingIndex=0;
  // クロックダウン（プレイヤーバフ）+2秒、魔王クロックダウンデバフ -1.5秒
  battle.typingLimit = word.limit
    + (battle.clockdownBuff   ?  2000 : 0)
    - (battle.clockdownDebuff ? 1500  : 0);
  battle.typingLimit = Math.max(1500, battle.typingLimit); // 最低1.5秒は保証
  battle.clockdownBuff   = false;
  battle.clockdownDebuff = false;
  battle.typingMpCost=word.mpCost;
  battle.typingStart=performance.now(); battle.typingElapsed=0;
  battle.typingSuccess=false; battle.phase='typing';
  battle.menuLevel=0; // メニューをカテゴリ選択に戻す
  battle.currentCmd=cmd; // 使用コマンドを記録
}

function finishTyping(success) {
  battle.typingElapsed=performance.now()-battle.typingStart;
  if (!success) {
    seTypingFail(); // 失敗SE
    setBattleMessage('タイピング失敗！ダメージ0！',true);
    return;
  }

  const ratio=battle.typingElapsed/battle.typingLimit;
  const cmd=battle.currentCmd||'kougeki';
  const atkMod=(playerAtk()/10)*(1+(battle.atkBuff||0));

  // タイピング速度ボーナス
  let speedMult, speedPrefix;
  if (ratio<0.3)      { speedMult=1.5; speedPrefix='会心の一撃！ '; }
  else if (ratio<0.7) { speedMult=1.0; speedPrefix=''; }
  else                { speedMult=0.6; speedPrefix='ギリギリ… '; }

  player.mp=Math.max(0,player.mp-(battle.typingMpCost||0));
  // aura 以外でバフ消費
  const consumesBuff = (cmd!=='aura');
  const usedBuff = battle.atkBuff;
  if (consumesBuff) battle.atkBuff=0;

  let msg='';

  // ===== こうげき系（id ベース） =====
  if (cmd==='kougeki') {
    const base=15+Math.floor(Math.random()*11);
    const dmg=Math.max(1,Math.round(base*atkMod*speedMult)-(enemy.def||0));
    enemy.hp=Math.max(0,enemy.hp-dmg);
    msg=speedPrefix+'こうげき！ '+dmg+'ダメージ！';
    msg = tryWeaponElement(msg);
    spawnEffect('kougeki');

  } else if (cmd==='renda') {
    const b1=10+Math.floor(Math.random()*6);
    const b2=8 +Math.floor(Math.random()*6);
    const d1=Math.max(1,Math.round(b1*atkMod*speedMult)-(enemy.def||0));
    const d2=Math.max(1,Math.round(b2*atkMod*speedMult)-(enemy.def||0));
    enemy.hp=Math.max(0,enemy.hp-d1-d2);
    msg=speedPrefix+'れんだ！ '+d1+'+'+d2+'ダメージ！';
    msg = tryWeaponElement(msg);
    spawnEffect('renda');

  } else if (cmd==='mineuchi') {
    const base=12+Math.floor(Math.random()*6);
    const dmg=Math.max(1,Math.round(base*atkMod*speedMult*0.5)-(enemy.def||0));
    enemy.hp=Math.max(0,enemy.hp-dmg);
    // まひ付与（敵がすでに状態異常でも上書き）
    enemy.status='paralysis'; enemy.statusTurns=2;
    msg=speedPrefix+'みねうち！ '+dmg+'ダメージ！ 敵はまひした！';
    spawnEffect('mineuchi');

  } else if (cmd==='dokugiri') {
    const base=12+Math.floor(Math.random()*6);
    const dmg=Math.max(1,Math.round(base*atkMod*speedMult*0.4)-(enemy.def||0));
    enemy.hp=Math.max(0,enemy.hp-dmg);
    // どく付与（敵がすでに状態異常でも上書き）
    enemy.status='poison'; enemy.statusTurns=5;
    msg=speedPrefix+'どくぎり！ '+dmg+'ダメージ！ 敵はどくになった！';
    spawnEffect('dokugiri');

  } else if (cmd==='taiatari') {
    const base=28+Math.floor(Math.random()*16);
    const dmg=Math.max(1,Math.round(base*atkMod*speedMult)-(enemy.def||0));
    const self=Math.floor(player.maxHp*0.08);
    enemy.hp=Math.max(0,enemy.hp-dmg);
    player.hp=Math.max(0,player.hp-self);
    msg=speedPrefix+'たいあたり！ '+dmg+'ダメージ！ (-'+self+'HP)';
    msg = tryWeaponElement(msg);
    spawnEffect('taiatari');
    if (player.hp<=0) {
      setBattleMessage(msg,false);
      return;
    }

  // ===== じゅもん系（id ベース） =====
  } else if (cmd==='frost') {
    const base=14+Math.floor(Math.random()*8);
    const magMod=player.atk/10;
    const dmg=Math.max(1,Math.round(base*magMod*speedMult));
    enemy.hp=Math.max(0,enemy.hp-dmg);
    msg=speedPrefix+'フロスト！ 氷の呪文！ '+dmg+'ダメージ！';
    msg += applyElementEffect('freeze');
    spawnEffect('frost');

  } else if (cmd==='heal') {
    const h=Math.floor(player.maxHp*0.4+8);
    player.hp=Math.min(player.maxHp,player.hp+h);
    msg='ヒール！ HP+'+h+' かいふく！';
    spawnEffect('heal');

  } else if (cmd==='clockdown') {
    battle.clockdownBuff=true;
    msg='クロックダウン！ 次のタイピング時間が延びた！';
    spawnEffect('clockdown');

  } else if (cmd==='aura') {
    battle.atkBuff=0.8;
    msg='オーラ！ 次の攻撃が強化された！';
    spawnEffect('aura');

  } else if (cmd==='ignis') {
    const base=22+Math.floor(Math.random()*12);
    const magMod=player.atk/10;
    const dmg=Math.max(1,Math.round(base*magMod*speedMult*1.3));
    enemy.hp=Math.max(0,enemy.hp-dmg);
    msg=speedPrefix+'イグニス！ 炎の呪文！ '+dmg+'ダメージ！';
    msg += applyElementEffect('burn');
    spawnEffect('ignis');
  }

  // 敵にダメージを与えた攻撃はシェイク＋被弾フラッシュを発火
  const dealsDmg = ['kougeki','renda','mineuchi','dokugiri','taiatari','frost','ignis'];
  if (dealsDmg.includes(cmd)) {
    battle.enemyShake     = 14; // 約14フレーム横揺れ
    battle.enemyHitFlash  = 8;  // 約8フレーム赤フラッシュ
  }

  setBattleMessage(msg, true);
}

// シェイク量を返すヘルパー（shakeFramesが>0の間、サイン波で横オフセットを生成）
function calcShake(frames, maxAmp) {
  if (frames <= 0) return 0;
  return Math.sin(frames * 1.8) * maxAmp * Math.min(1, frames / 6);
}

// ========== 属性効果付与 ==========
// element: 'burn' | 'freeze' | 'shock'
// 呼び出し元で enemy.hp <= 0 チェック後に呼ぶこと
function applyElementEffect(element) {
  if (!element || !enemy) return '';
  switch (element) {
    case 'burn':
      // 炎：3ターン持続ダメージ（最大HPの6%/T）
      // burn は poison より優先して上書き
      if (enemy.status !== 'freeze') {
        const bd = Math.max(1, Math.floor(enemy.maxHp * 0.06));
        enemy.status = 'burn';
        enemy.statusTurns = 3;
        enemy.burnDmg = bd;
        return ' 🔥もえている！(' + bd + '/T×3)';
      }
      return '';
    case 'freeze':
      // 氷：1ターン行動不能 + 防御力30%減
      enemy.status = 'freeze';
      enemy.statusTurns = 1;
      enemy.freezeDefMod = 0.7; // 凍結中は def×0.7 で計算
      return ' 🧊こおった！(1T行動不能 DEF-30%)';
    case 'shock':
      // 雷：2ターンまひ（paralysisと同等）
      if (enemy.status !== 'freeze') {
        enemy.status = 'shock';
        enemy.statusTurns = 2;
        return ' ⚡かんでんした！(2Tまひ)';
      }
      return '';
    default:
      return '';
  }
}

// 武器の属性を通常攻撃に乗せる（こうげき/れんだ/たいあたり 系で呼ぶ）
// 確率判定して属性メッセージを返す
function tryWeaponElement(msgSuffix) {
  const wid = player.equip.weapon;
  if (!wid) return msgSuffix;
  const wm = WEAPON_MASTER[wid];
  if (!wm || !wm.element) return msgSuffix;
  if (Math.random() < (wm.elemChance || 0)) {
    msgSuffix += applyElementEffect(wm.element);
  }
  return msgSuffix;
}

function setBattleMessage(msg,enemyNext) {
  battle.message=msg; battle.messageTimer=battle.messageDuration;
  battle.phase='result_player'; battle.enemyPending=enemyNext;
}

function enemyAttack() {

  // ===== 凍結（freeze）：1ターン行動完全スキップ（40%/Tで早期解除） =====
  if (enemy.status === 'freeze') {
    const breakFrozen = Math.random() < 0.40;
    enemy.statusTurns--;
    if (enemy.statusTurns <= 0 || breakFrozen) {
      enemy.status = null; enemy.statusTurns = 0; enemy.freezeDefMod = 0;
      const brMsg = breakFrozen ? '（こおりがとけた！）' : '';
      battle.message = enemy.name + ' はこおりついて うごけない！ 🧊 ' + brMsg;
    } else {
      battle.message = enemy.name + ' はこおりついて うごけない！ 🧊';
    }
    battle.messageTimer = battle.messageDuration;
    battle.phase = 'result_enemy';
    battle.enemyPending = false;
    spawnEffect('frost');
    return;
  }

  // ===== 雷（shock）：まひと同等（25%/Tで早期解除） =====
  if (enemy.status === 'shock') {
    const breakShock = Math.random() < 0.25;
    enemy.statusTurns--;
    if (enemy.statusTurns <= 0 || breakShock) {
      enemy.status = null; enemy.statusTurns = 0;
      const brMsg = breakShock ? '（かんでんがおさまった！）' : '';
      battle.message = enemy.name + ' はかんでんして うごけない！ ⚡ ' + brMsg;
    } else {
      battle.message = enemy.name + ' はかんでんして うごけない！ ⚡';
    }
    battle.messageTimer = battle.messageDuration;
    battle.phase = 'result_enemy';
    battle.enemyPending = false;
    return;
  }

  // ===== まひ（paralysis）：行動スキップ（25%/Tで早期解除） =====
  if (enemy.status === 'paralysis') {
    const breakPara = Math.random() < 0.25;
    enemy.statusTurns--;
    if (enemy.statusTurns <= 0 || breakPara) {
      enemy.status = null; enemy.statusTurns = 0;
      const brMsg = breakPara ? '（まひがとけた！）' : '';
      battle.message = enemy.name + ' はまひして うごけない！ ' + brMsg;
    } else {
      battle.message = enemy.name + ' はまひして うごけない！';
    }
    battle.messageTimer = battle.messageDuration;
    battle.phase = 'result_enemy';
    battle.enemyPending = false;
    return;
  }

  // ===== 炎（burn）：ターン開始時に持続ダメージ（30%/Tで早期解除） =====
  let burnMsg = '';
  if (enemy.status === 'burn') {
    const breakBurn = Math.random() < 0.30;
    const bdmg = enemy.burnDmg || Math.max(1, Math.floor(enemy.maxHp * 0.06));
    enemy.hp = Math.max(0, enemy.hp - bdmg);
    enemy.statusTurns--;
    if (enemy.statusTurns <= 0 || breakBurn) {
      enemy.status = null; enemy.statusTurns = 0; enemy.burnDmg = 0;
      burnMsg = ' 🔥【やけど ' + bdmg + 'ダメ】（ほのおがきえた！）';
    } else {
      burnMsg = ' 🔥【やけど ' + bdmg + 'ダメ】';
    }
    spawnEffect('ignis');
    if (enemy.hp <= 0) {
      battle.message = enemy.name + ' はやけどでたおれた！' + burnMsg;
      battle.messageTimer = battle.messageDuration;
      battle.phase = 'result_player';
      battle.enemyPending = false;
      return;
    }
  }

  // ===== どく：攻撃前にどくダメージ（20%/Tで早期解除） =====
  let poisonMsg = '';
  if (enemy.status === 'poison') {
    const breakPoison = Math.random() < 0.20;
    const pdmg = Math.max(1, Math.floor(enemy.maxHp * 0.08));
    enemy.hp   = Math.max(0, enemy.hp - pdmg);
    enemy.statusTurns--;
    if (enemy.statusTurns <= 0 || breakPoison) {
      enemy.status = null; enemy.statusTurns = 0;
      poisonMsg = ' 【どく ' + pdmg + 'ダメージ】（どくがきえた！）';
    } else {
      poisonMsg = ' 【どく ' + pdmg + 'ダメージ】';
    }

    // どくで敵HP0 → 勝利扱いにするため result_player フェーズへ委譲
    if (enemy.hp <= 0) {
      battle.message = enemy.name + ' はどくでたおれた！' + poisonMsg;
      battle.messageTimer = battle.messageDuration;
      battle.phase = 'result_player'; // gameLoop の勝利判定に乗せる
      battle.enemyPending = false;
      return;
    }
  }

  // ===== ボス（魔王）専用AI =====
  if (enemy.isBoss) {
    // MP不足チェックヘルパー
    const canUseMP = (cost) => enemy.mp >= cost;

    // 条件1: HP30%以下かつ30%の確率でヒール（MP6）
    if (enemy.hp / enemy.maxHp <= 0.3 && Math.random() < 0.3 && canUseMP(6)) {
      enemy.mp   -= 6;
      enemy.hp    = Math.min(enemy.maxHp, enemy.hp + 200);
      battle.message = '魔王は 『ヒール』 を唱えた！ HP+200！';
      battle.messageTimer = battle.messageDuration;
      battle.phase = 'result_enemy';
      battle.enemyPending = false;
      spawnEffect('heal');
      return;
    }

    // 条件2: その他の行動（確率分岐）
    const roll = Math.random();
    if (roll < 0.40 || !canUseMP(4)) {
      // 40% or MP切れ → 通常こうげき
      const dmg = Math.max(1, (enemy.atk||45) - playerDef());
      player.hp  = Math.max(0, player.hp - dmg);
      seDamageReceived();
      battle.playerShake = 14; battle.playerHitFlash = 8;
      battle.message = '魔王のこうげき！ ' + dmg + 'ダメージ！' + poisonMsg;
      spawnEffect('enemy_attack');
    } else if (roll < 0.60 && canUseMP(8)) {
      // 20% → イグニス（MP8）
      enemy.mp -= 8;
      const base = 22 + Math.floor(Math.random()*12);
      const dmg  = Math.max(1, Math.round(base * (enemy.atk/10) * 1.5));
      player.hp  = Math.max(0, player.hp - dmg);
      seDamageReceived();
      battle.playerShake = 18; battle.playerHitFlash = 12;
      battle.message = '魔王の 『イグニス』！ 炎の呪文！ ' + dmg + 'ダメージ！';
      spawnEffect('ignis');
    } else if (roll < 0.80 && canUseMP(4)) {
      // 20% → クロックダウン（MP4）：プレイヤーのタイピング時間-1.5秒
      enemy.mp -= 4;
      battle.clockdownDebuff = true;
      battle.message = '魔王の 『クロックダウン』！ タイピング時間が縮んだ！';
      spawnEffect('clockdown');
    } else if (canUseMP(5)) {
      // 20% → ダークネス（MP5）：次のタイピング文字を一部隠す
      enemy.mp -= 5;
      battle.darknessDebuff = true;
      battle.message = '魔王の 『ダークネス』！ 闇に包まれた！ 文字が見えない！';
      spawnEffect('darkness');
    } else {
      // MP不足フォールバック → こうげき
      const dmg = Math.max(1, (enemy.atk||45) - playerDef());
      player.hp  = Math.max(0, player.hp - dmg);
      seDamageReceived();
      battle.message = '魔王のこうげき！ ' + dmg + 'ダメージ！';
      spawnEffect('enemy_attack');
    }

    battle.messageTimer  = battle.messageDuration;
    battle.phase         = 'result_enemy';
    battle.enemyPending  = false;
    return;
  }

  // ===== 通常攻撃 =====
  const dmg = Math.max(1, (enemy.atk||10) - playerDef());
  player.hp  = Math.max(0, player.hp - dmg);
  seDamageReceived();
  // プレイヤー被弾シェイク＋フラッシュ
  battle.playerShake    = 14;
  battle.playerHitFlash = 8;
  battle.message = enemy.name + ' のこうげき！ ' + dmg + 'ダメージ！' + poisonMsg;
  battle.messageTimer = battle.messageDuration;
  battle.phase = 'result_enemy';
  battle.enemyPending = false;
  // 敵攻撃エフェクト
  spawnEffect('enemy_attack');
}

// ===== 戦闘エフェクトシステム =====
const effects = []; // { type, particles:[], timer, duration }

// 敵の中心座標（エフェクトの基準点）
const EX = W/2+40, EY = H*0.35;
// プレイヤーの中心座標
const PX = W/4,    PY = H*0.42;

function spawnEffect(type) {
  const now = performance.now();
  const p = [];
  switch(type) {
    case 'kougeki':
      // 白い斬撃線3本
      for (let i=0;i<3;i++) {
        const angle = -0.4 + i*0.4;
        p.push({x:EX-20+i*8, y:EY-10, vx:60*Math.cos(angle), vy:-40+i*10,
                life:1, maxLife:1, type:'slash', angle});
      }
      break;
    case 'renda':
      // 黄色打撃フラッシュ2発
      for (let i=0;i<2;i++) {
        p.push({x:EX+(i*20-10), y:EY, vx:0, vy:0, life:1, maxLife:1, delay:i*8,
                type:'impact', color:'#FFDD44'});
      }
      break;
    case 'mineuchi':
      // 水色の斬撃線（みねうち：弱め）
      for (let i=0;i<2;i++) {
        const angle = -0.3 + i*0.6;
        p.push({x:EX-10+i*12, y:EY-5, vx:40*Math.cos(angle), vy:-30+i*10,
                life:1, maxLife:1, type:'slash', angle, color:'#AADDFF'});
      }
      break;
    case 'dokugiri':
      // 緑の毒しぶき
      for (let i=0;i<10;i++) {
        p.push({x:EX+(Math.random()-0.5)*20, y:EY,
                vx:(Math.random()-0.5)*2.5, vy:-(1+Math.random()*3),
                life:1, maxLife:1, size:3+Math.random()*5,
                type:'fire', color:'#44FF44'});
      }
      break;
    case 'taiatari':
      // オレンジの衝撃波リング
      for (let i=0;i<12;i++) {
        const a = (i/12)*Math.PI*2;
        p.push({x:EX, y:EY, vx:Math.cos(a)*3, vy:Math.sin(a)*1.5,
                life:1, maxLife:1, type:'ring', color:'#FF8800'});
      }
      break;
    case 'frost':
      // 青い氷の結晶
      for (let i=0;i<16;i++) {
        const a = (i/16)*Math.PI*2;
        p.push({x:EX, y:EY, vx:Math.cos(a)*2.5, vy:Math.sin(a)*1.2,
                life:1, maxLife:1, type:'ice',
                color:['#AADDFF','#88CCFF','#FFFFFF'][Math.floor(Math.random()*3)]});
      }
      break;
    case 'heal':
      // 緑の光玉が上昇
      for (let i=0;i<12;i++) {
        p.push({x:PX+(Math.random()-0.5)*40, y:PY+10,
                vx:(Math.random()-0.5)*1.5, vy:-(1.5+Math.random()*2.5),
                life:1, maxLife:1, size:3+Math.random()*5,
                type:'fire', color:['#44FF88','#88FFAA','#FFFFFF'][Math.floor(Math.random()*3)]});
      }
      break;
    case 'clockdown':
      // 水色の時計エフェクト（円弧放射）
      for (let i=0;i<16;i++) {
        const a = (i/16)*Math.PI*2;
        p.push({x:EX, y:EY, vx:Math.cos(a)*2, vy:Math.sin(a)*1,
                life:1, maxLife:1, type:'ice', color:'#CCCCFF'});
      }
      break;
    case 'aura':
      // 金色オーラ（プレイヤー周囲に広がる円弧）
      for (let i=0;i<20;i++) {
        const a = (i/20)*Math.PI*2;
        p.push({x:PX+Math.cos(a)*20, y:PY+Math.sin(a)*10,
                vx:Math.cos(a)*1.5, vy:Math.sin(a)*0.8,
                life:1, maxLife:1, type:'aura', color:'#FFD700'});
      }
      break;
    case 'ignis':
      // 炎パーティクル群
      for (let i=0;i<20;i++) {
        p.push({x:EX+(Math.random()-0.5)*30, y:EY+20,
                vx:(Math.random()-0.5)*3, vy:-(2+Math.random()*4),
                life:1, maxLife:1, size:4+Math.random()*8,
                type:'fire', color:['#FF2200','#FF6600','#FFAA00','#FFEE00'][Math.floor(Math.random()*4)]});
      }
      break;
    case 'enemy_attack':
      // 赤い爪傷線
      for (let i=0;i<3;i++) {
        p.push({x:PX-15+i*12, y:PY-15, vx:20, vy:25+i*5,
                life:1, maxLife:1, type:'claw', angle:-0.5+i*0.4});
      }
      break;
    case 'darkness':
      // 紫黒の闇パーティクル
      for (let i=0;i<18;i++) {
        const a = (i/18)*Math.PI*2;
        p.push({x:PX+Math.cos(a)*25, y:PY+Math.sin(a)*12,
                vx:Math.cos(a)*1.2, vy:Math.sin(a)*0.6,
                life:1, maxLife:1, type:'ring', color:'#880088'});
      }
      break;
  }
  effects.push({ type, particles:p, timer:0, duration:35 });
}

function updateEffects(dt) {
  for (let i=effects.length-1;i>=0;i--) {
    const ef=effects[i];
    ef.timer++;
    const progress=ef.timer/ef.duration; // 0→1
    for (const p of ef.particles) {
      if (p.delay && ef.timer < p.delay) continue;
      p.life = 1 - progress;
      p.x += p.vx * (dt/16);
      p.y += p.vy * (dt/16);
    }
    if (ef.timer >= ef.duration) effects.splice(i,1);
  }
}

function drawEffects() {
  for (const ef of effects) {
    const progress = ef.timer/ef.duration;
    ctx.save();
    for (const p of ef.particles) {
      if (p.delay && ef.timer < p.delay) continue;
      ctx.globalAlpha = Math.max(0, p.life * (1-progress*0.3));

      switch(p.type) {
        case 'slash': {
          // 斬撃線：太い白いストローク
          ctx.strokeStyle='#FFFFFF';
          ctx.lineWidth=3*(1-progress)+1;
          ctx.lineCap='round';
          const len=35*(1-progress*0.5);
          ctx.beginPath();
          ctx.moveTo(p.x - Math.cos(p.angle)*len, p.y - Math.sin(p.angle)*len);
          ctx.lineTo(p.x + Math.cos(p.angle)*len, p.y + Math.sin(p.angle)*len);
          ctx.stroke();
          // 白いグロー
          ctx.strokeStyle='rgba(255,255,255,0.3)';
          ctx.lineWidth=8*(1-progress);
          ctx.beginPath();
          ctx.moveTo(p.x - Math.cos(p.angle)*len, p.y - Math.sin(p.angle)*len);
          ctx.lineTo(p.x + Math.cos(p.angle)*len, p.y + Math.sin(p.angle)*len);
          ctx.stroke();
          break;
        }
        case 'impact': {
          // 打撃フラッシュ：広がる多角形
          const r=20+progress*25;
          ctx.fillStyle=p.color;
          ctx.beginPath();
          for (let k=0;k<6;k++) {
            const a=(k/6)*Math.PI*2 + progress*0.5;
            k===0 ? ctx.moveTo(p.x+Math.cos(a)*r, p.y+Math.sin(a)*r*0.6)
                  : ctx.lineTo(p.x+Math.cos(a)*r, p.y+Math.sin(a)*r*0.6);
          }
          ctx.closePath(); ctx.fill();
          break;
        }
        case 'ring': {
          // 衝撃波リング：輪郭の円
          ctx.fillStyle=p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 3*(1-progress*0.5), 0, Math.PI*2);
          ctx.fill();
          break;
        }
        case 'fire': {
          // 炎：上に伸びる丸
          ctx.fillStyle=p.color;
          ctx.beginPath();
          ctx.ellipse(p.x, p.y, (p.size||6)*(1-progress*0.5), (p.size||6)*(1+progress), 0, 0, Math.PI*2);
          ctx.fill();
          break;
        }
        case 'ice': {
          // 氷の結晶：小さな菱形
          const s=5*(1-progress*0.3);
          ctx.fillStyle=p.color;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y-s); ctx.lineTo(p.x+s*0.5, p.y);
          ctx.lineTo(p.x, p.y+s); ctx.lineTo(p.x-s*0.5, p.y);
          ctx.closePath(); ctx.fill();
          // 十字
          ctx.strokeStyle=p.color; ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(p.x-s, p.y); ctx.lineTo(p.x+s, p.y); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(p.x, p.y-s); ctx.lineTo(p.x, p.y+s); ctx.stroke();
          break;
        }
        case 'heal': {
          // 回復：輝く丸
          ctx.fillStyle=p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, (p.size||4)*(1-progress*0.3), 0, Math.PI*2);
          ctx.fill();
          // グロー
          ctx.fillStyle='rgba(100,255,150,0.2)';
          ctx.beginPath();
          ctx.arc(p.x, p.y, (p.size||4)*2*(1-progress*0.3), 0, Math.PI*2);
          ctx.fill();
          break;
        }
        case 'aura': {
          // バイキルトオーラ：輝く点が広がる
          ctx.fillStyle=p.color;
          const s=4*(1-progress*0.5);
          ctx.beginPath();
          ctx.arc(p.x, p.y, s, 0, Math.PI*2);
          ctx.fill();
          break;
        }
        case 'claw': {
          // 爪傷：赤い斜め線
          ctx.strokeStyle='#FF2222';
          ctx.lineWidth=3*(1-progress*0.5)+1;
          ctx.lineCap='round';
          const len=30;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x+Math.cos(p.angle)*len, p.y+Math.sin(p.angle)*len);
          ctx.stroke();
          // 赤いグロー
          ctx.strokeStyle='rgba(255,50,50,0.3)';
          ctx.lineWidth=8*(1-progress);
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x+Math.cos(p.angle)*len, p.y+Math.sin(p.angle)*len);
          ctx.stroke();
          break;
        }
      }
    }
    ctx.restore();
  }
}

// ===== ミニマップ描画 =====
// バイオームID → ミニマップ表示色
const MINIMAP_BIOME_COLOR = [
  '#4A9A50', // 0 平原：緑
  '#2A6A28', // 1 森：濃緑
  '#C8A840', // 2 砂漠：黄砂
  '#C8D8F0', // 3 雪原：白青
  '#2A1808', // 4 火山：黒
  '#3A5028', // 5 湿地：暗緑
  '#60A8C0', // 6 海岸：水色
];
const MINIMAP_WATER_COLOR = '#2060A0'; // tileId=70 水
const MINIMAP_LAVA_COLOR  = '#CC3300'; // tileId=71 溶岩

// ミニマップはキャッシュ用OffscreenCanvas（またはHTMLCanvasElement）に事前描画し
// プレイヤー移動のたびに再描画するコストを避ける。
// ただしOffscreenCanvasが使えない環境を考慮し、通常Canvasでフォールバックする。
let _minimapCache = null;       // キャッシュCanvas
let _minimapDirty = true;       // true のとき次フレームで再生成

/** キャッシュが無効なとき（マップ変更時など）に呼んでキャッシュを破棄する */
function invalidateMinimap() {
  _minimapDirty = true;
}

/**
 * 地形ベース（バイオーム色）のミニマップキャッシュを生成する。
 * プレイヤー・村・宿などの動的要素はキャッシュしない。
 */
function _buildMinimapCache(dotSize) {
  const cw = MAP_W * dotSize;
  const ch = MAP_H * dotSize;

  // キャッシュ先のCanvas（OffscreenCanvas 優先、なければ通常Canvas）
  let cache;
  try {
    cache = new OffscreenCanvas(cw, ch);
  } catch (_) {
    cache = document.createElement('canvas');
    cache.width  = cw;
    cache.height = ch;
  }
  const c2 = cache.getContext('2d');

  for (let ty = 0; ty < MAP_H; ty++) {
    for (let tx = 0; tx < MAP_W; tx++) {
      const tid   = mapTiles[ty][tx];
      const biome = mapBiome[ty][tx];

      if (tid === 70) {
        c2.fillStyle = MINIMAP_WATER_COLOR;
      } else if (tid === 71) {
        c2.fillStyle = MINIMAP_LAVA_COLOR;
      } else {
        c2.fillStyle = MINIMAP_BIOME_COLOR[biome] || '#888888';
      }
      c2.fillRect(tx * dotSize, ty * dotSize, dotSize, dotSize);
    }
  }

  // 村・宿屋をキャッシュ時点で描いておく（静的なので問題なし）
  for (const t of mapTowns) {
    c2.fillStyle = t.type === 'village' ? '#FFEE44' : '#44AAFF';
    // 2×2 ドットで描画（dotSize=2 のとき 4px 四方）
    c2.fillRect(t.tx * dotSize - 1, t.ty * dotSize - 1, dotSize + 1, dotSize + 1);
  }

  return cache;
}

/**
 * ミニマップをメインキャンバスに描画する。
 * @param {number} ox  ミニマップ左上X（メインキャンバス座標）
 * @param {number} oy  ミニマップ左上Y（メインキャンバス座標）
 */
function drawMinimap(ox, oy) {
  const dotSize  = 2;                    // 1タイルあたりのドットサイズ(px)
  const mmW      = MAP_W * dotSize;      // 160px
  const mmH      = MAP_H * dotSize;      // 160px
  const padding  = 4;                    // 枠の内側パディング
  const frameW   = mmW + padding * 2;
  const frameH   = mmH + padding * 2;

  // ---- 背景フレーム ----
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(ox, oy, frameW, frameH);
  ctx.strokeStyle = 'rgba(200,200,200,0.6)';
  ctx.lineWidth = 1;
  ctx.strokeRect(ox + 0.5, oy + 0.5, frameW - 1, frameH - 1);

  // ---- 地形キャッシュの生成・描画 ----
  if (_minimapDirty || !_minimapCache) {
    _minimapCache = _buildMinimapCache(dotSize);
    _minimapDirty = false;
  }

  const drawX = ox + padding;
  const drawY = oy + padding;

  // OffscreenCanvas / HTMLCanvasElement のどちらでも drawImage で描ける
  ctx.drawImage(_minimapCache, drawX, drawY);

  // ---- プレイヤー位置（赤い輝点） ----
  const px = drawX + Math.round(field.px) * dotSize;
  const py = drawY + Math.round(field.py) * dotSize;

  // グロー
  ctx.fillStyle = 'rgba(255,80,80,0.35)';
  ctx.fillRect(px - 2, py - 2, dotSize + 4, dotSize + 4);
  // 本体
  ctx.fillStyle = '#FF3333';
  ctx.fillRect(px, py, dotSize, dotSize);

  // ---- ボス位置（生存中のみ紫ドット） ----
  if (!BOSS_EVENT.isDefeated) {
    const bx = drawX + BOSS_EVENT.tx * dotSize;
    const by = drawY + BOSS_EVENT.ty * dotSize;
    // グロー（点滅）
    const blink = Math.floor(Date.now() / 400) % 2 === 0;
    ctx.fillStyle = blink ? 'rgba(255,0,255,0.5)' : 'rgba(120,0,120,0.3)';
    ctx.fillRect(bx - 2, by - 2, dotSize + 4, dotSize + 4);
    // 本体
    ctx.fillStyle = '#FF00FF';
    ctx.fillRect(bx, by, dotSize, dotSize);
  }

  // ---- 「MAP」ラベル ----
  ctx.fillStyle   = 'rgba(255,255,255,0.55)';
  ctx.font        = '9px monospace';
  ctx.textBaseline = 'top';
  ctx.textAlign   = 'left';
  ctx.fillText('MAP', ox + padding, oy + 1);
  ctx.textBaseline = 'alphabetic';
}

// ===== あそびかた画面描画 =====
function drawHowToPlay(animTimer) {
  // 背景（タイトルと同じ夜空）
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#050A18');
  bg.addColorStop(1, '#0A1830');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // ===== タイトル帯 =====
  ctx.fillStyle = 'rgba(20,40,100,0.7)';
  ctx.fillRect(0, 10, W, 38);
  ctx.strokeStyle = 'rgba(100,150,255,0.4)';
  ctx.lineWidth = 1;
  ctx.strokeRect(0, 10, W, 38);
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 20px monospace';
  ctx.fillText('📖  あそびかた', W / 2, 29);

  // ===== セクション描画ヘルパー =====
  const SEC_X   = 32;   // 左端
  const SEC_W   = W - 64;
  let   curY    = 66;
  const LINE_H  = 22;

  function drawSection(icon, title2, lines) {
    // セクション見出し背景
    ctx.fillStyle = 'rgba(30,60,130,0.5)';
    ctx.fillRect(SEC_X - 4, curY - 14, SEC_W + 8, 22);
    ctx.strokeStyle = 'rgba(80,120,255,0.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(SEC_X - 4, curY - 14, SEC_W + 8, 22);

    ctx.textAlign = 'left';
    ctx.fillStyle = '#88CCFF';
    ctx.font = 'bold 14px monospace';
    ctx.fillText(icon + '  ' + title2, SEC_X, curY);
    curY += LINE_H + 2;

    ctx.fillStyle = '#DDDDDD';
    ctx.font = '13px monospace';
    for (const line of lines) {
      ctx.fillText('  ' + line, SEC_X, curY);
      curY += LINE_H;
    }
    curY += 6; // セクション間余白
  }

  // ===== 【操作方法】 =====
  drawSection('🎮', '操作方法', [
    '移動         ↑↓←→ または W/A/S/D キー',
    'セーブ       S キー（フィールド中）',
    'BGM ON/OFF   B キー（いつでも）',

function drawTitle(animTimer) {
  const hasSave = hasSaveData();

  // 背景グラデーション（夜空風）
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#050A18');
  bg.addColorStop(1, '#0A1830');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 星
  ctx.fillStyle = '#FFFFFF';
  const stars = [
    30,20, 80,50, 140,15, 200,40, 280,10, 340,35, 410,18,
    470,45, 520,22, 580,38, 610,12, 60,70, 180,65, 360,72,
    500,60, 550,80, 90,90, 250,85, 430,90,
  ];
  for (let i = 0; i < stars.length; i += 2) {
    ctx.globalAlpha = 0.4 + Math.sin(animTimer * 0.04 + i) * 0.3;
    ctx.fillRect(stars[i], stars[i+1], 1.5, 1.5);
  }
  ctx.globalAlpha = 1;

  // タイトルロゴ（影つき）
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // 影
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.font = 'bold 30px monospace';
  ctx.fillText('ハイブリッド・タイピングRPG', W/2 + 3, H * 0.28 + 3);

  // 本体（グラデーション）
  const titleGrad = ctx.createLinearGradient(0, H*0.18, 0, H*0.38);
  titleGrad.addColorStop(0, '#FFE866');
  titleGrad.addColorStop(0.5, '#FFD700');
  titleGrad.addColorStop(1, '#CC9900');
  ctx.fillStyle = titleGrad;
  ctx.font = 'bold 30px monospace';
  ctx.fillText('ハイブリッド・タイピングRPG', W/2, H * 0.28);

  // サブタイトル
  ctx.fillStyle = '#AACCFF';
  ctx.font = '14px monospace';
  ctx.fillText('~ キーボードで冒険しよう ~', W/2, H * 0.38);

  // セパレータ
  ctx.strokeStyle = 'rgba(100,150,255,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W * 0.2, H * 0.44);
  ctx.lineTo(W * 0.8, H * 0.44);
  ctx.stroke();

  // メニュー項目
  // idx は描画上の順番（セーブなし時は「つづきから」をスキップして詰める）
  const menuItems = [
    { label: 'はじめから', id: 0, always: true  },
    { label: 'つづきから', id: 1, always: false },
    { label: 'あそびかた', id: 2, always: true  },
  ];
  // 実際に表示する項目だけ抽出（セーブなし時は「つづきから」を除外）
  const visibleItems = menuItems.filter(it => it.always || hasSave);

  const menuBaseY = H * 0.52;
  const menuStep  = 46;

  for (let vi = 0; vi < visibleItems.length; vi++) {
    const item  = visibleItems[vi];
    const isSel = title.cursor === vi;
    const itemY = menuBaseY + vi * menuStep;

    // 選択中は背景ハイライト
    if (isSel) {
      const hlW = 260, hlH = 38;
      const hlX = W/2 - hlW/2;
      ctx.fillStyle = 'rgba(50,80,160,0.55)';
      ctx.fillRect(hlX, itemY - hlH/2, hlW, hlH);
      ctx.strokeStyle = '#5588FF';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(hlX, itemY - hlH/2, hlW, hlH);
    }

    // カーソル記号（点滅）
    const showCursor = isSel && Math.floor(animTimer / 20) % 2 === 0;
    ctx.fillStyle = isSel ? '#FFD700' : '#AAAAAA';
    ctx.font = (isSel ? 'bold ' : '') + '22px monospace';
    ctx.fillText((showCursor ? '▶ ' : '  ') + item.label, W/2, itemY);
  }

  // カーソルを有効範囲内にクランプ
  if (title.cursor >= visibleItems.length) title.cursor = visibleItems.length - 1;

  // 操作説明
  const blinkOn = Math.floor(animTimer / 35) % 2 === 0;
  ctx.fillStyle = blinkOn ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.3)';
  ctx.font = '14px monospace';
  ctx.fillText('↑↓ で選択   Enter / Space で決定', W/2, H * 0.86);

  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

// ===== Web Audio API / SE =====
// AudioContext はユーザー操作後に初めて生成する（ブラウザの自動再生ポリシー対応）
let _audioCtx = null;

function getAudioCtx() {
  if (!_audioCtx) {
    try {
      _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {
      console.warn('[Audio] Web Audio API が使えません:', e);
    }
  }
  // suspended 状態（モバイルなど）の場合は再開を試みる
  if (_audioCtx && _audioCtx.state === 'suspended') {
    _audioCtx.resume();
  }
  return _audioCtx;
}

/**
 * 汎用オシレーター再生ヘルパー。
 * @param {object[]} notes  [{freq, startOffset, duration, gain, type}]
 *   - freq        : 周波数(Hz)
 *   - startOffset : audioCtx.currentTime からの開始秒
 *   - duration    : 音符の長さ(秒)
 *   - gain        : 音量 0.0〜1.0
 *   - type        : OscillatorType ('sine'|'square'|'triangle'|'sawtooth')
 */
function _playNotes(notes) {
  const ctx2 = getAudioCtx();
  if (!ctx2) return;

  for (const n of notes) {
    const osc  = ctx2.createOscillator();
    const gain = ctx2.createGain();

    osc.connect(gain);
    gain.connect(ctx2.destination);

    osc.type      = n.type  || 'square';
    osc.frequency.setValueAtTime(n.freq, ctx2.currentTime + n.startOffset);

    // アタック → サステイン → リリースのエンベロープ
    const t0      = ctx2.currentTime + n.startOffset;
    const attack  = 0.005;          // 5ms アタック
    const release = n.duration * 0.3; // 音符長の30%をリリースに使う
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(n.gain, t0 + attack);
    gain.gain.setValueAtTime(n.gain, t0 + n.duration - release);
    gain.gain.linearRampToValueAtTime(0, t0 + n.duration);

    osc.start(t0);
    osc.stop(t0 + n.duration);
  }
}

// BGMの内部状態
const bgm = {
  current:    null,      // 再生中のトラック名
  nodes:      [],        // 現在のオシレーター + ゲインノードのリスト
  loopTimer:  null,      // 次ループのsetTimeout ID
  enabled:    true,      // BGM ON/OFF フラグ（Bキーでトグル）
};

/**
 * BGMを停止する。
 * 再生中のオシレーターを全て即時停止し、ループタイマーをキャンセルする。
 */
function bgmStop() {
  if (bgm.loopTimer !== null) {
    clearTimeout(bgm.loopTimer);
    bgm.loopTimer = null;
  }
  for (const { osc, gain } of bgm.nodes) {
    try {
      gain.gain.setValueAtTime(0, getAudioCtx()?.currentTime || 0);
      osc.stop();
    } catch (_) {}
  }
  bgm.nodes    = [];
  bgm.current  = null;
}

/**
 * 指定トラックのBGMを再生する（ループ）。
 * すでに同じトラックが再生中の場合は何もしない。
 * @param {string} trackName BGM_TRACKS のキー名
 */
function bgmPlay(trackName) {
  if (!bgm.enabled) return;
  if (bgm.current === trackName) return; // 同じトラックは継続
  bgmStop();

  const ctx2 = getAudioCtx();
  if (!ctx2) return;

  const track = BGM_TRACKS[trackName];
  if (!track) return;

  bgm.current = trackName;

  const beatSec = 60 / track.bpm; // 四分音符1拍の秒数

  function scheduleLoop() {
    if (bgm.current !== trackName) return; // 停止済みなら終了
    const now = ctx2.currentTime;
    let t = now;

    for (const note of track.loop) {
      const noteDur = note.dur * beatSec;
      if (note.freq > 0 && note.gain > 0) {
        const osc  = ctx2.createOscillator();
        const gain = ctx2.createGain();
        osc.connect(gain);
        gain.connect(ctx2.destination);
        osc.type = note.type || 'square';
        osc.frequency.setValueAtTime(note.freq, t);
        // エンベロープ（短いアタック＋リリース）
        const attack  = 0.008;
        const release = Math.min(noteDur * 0.25, 0.06);
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(note.gain, t + attack);
        gain.gain.setValueAtTime(note.gain, t + noteDur - release);
        gain.gain.linearRampToValueAtTime(0, t + noteDur);
        osc.start(t);
        osc.stop(t + noteDur);
        bgm.nodes.push({ osc, gain });
      }
      t += noteDur;
    }

    // ループ間隔 = このループの総再生時間
    const loopDuration = track.loop.reduce((s, n) => s + n.dur * beatSec, 0);
    // 完了した古いノードを定期的に解放
    bgm.nodes = bgm.nodes.filter(n => {
      try { return n.osc.context.state !== 'closed'; } catch (_) { return false; }
    });
    bgm.loopTimer = setTimeout(scheduleLoop, (loopDuration - 0.05) * 1000);
  }

  scheduleLoop();
}

/** mode に応じたBGMに切り替える */
function bgmSyncToMode(newMode) {
  if (!bgm.enabled) return;
  switch (newMode) {
    case 'title':
    case 'howtoplay':
    case 'field':      bgmPlay('field');     break;
    case 'flash':
    case 'battle':     bgmPlay('battle');    break;
    case 'victory':    bgmPlay('victory');   break;
    case 'gameover':   bgmPlay('gameover');  break;
    case 'gameclear':  bgmPlay('gameclear'); break;
  }
}

// ===== セーブ・ロード =====
const SAVE_KEY = 'typingRPG_save_v1';

/**
 * 現在のゲーム状態を localStorage に保存する。
 * マップデータ（mapTiles / mapBiome / mapObjects / mapTowns）は
 * 固定シードで再生成できるため保存しない。
 * フィールドモードでのみ呼び出す想定（戦闘中は保存不可）。
 */
function saveGame() {
  // 戦闘中・フラッシュ中はセーブ不可
  if (mode !== 'field') return false;

  const data = {
    version: 1,
    savedAt: Date.now(),
    // --- プレイヤーステータス ---
    player: {
      hp:       player.hp,
      maxHp:    player.maxHp,
      mp:       player.mp,
      maxMp:    player.maxMp,
      lv:       player.lv,
      exp:      player.exp,
      atk:      player.atk,
      def:      player.def,
      coins:    player.coins,
      equip:    { weapon: player.equip.weapon, armor: player.equip.armor },
      inventory: player.inventory.map(s => ({ itemId: s.itemId, qty: s.qty })),
      learnedAttacks: player.learnedAttacks.slice(),
      learnedMagics:  player.learnedMagics.slice(),
    },
    // --- ボスクリアフラグ ---
    bossDefeated: BOSS_EVENT.isDefeated,
    // --- フィールド状態 ---
    field: {
      px:          field.px,
      py:          field.py,
      stepCount:   field.stepCount,
      encountSteps:field.encountSteps,
      facing:      field.facing,
    },
    // --- ゲームモード ---
    mode: 'field', // セーブはフィールド時のみ → 常に 'field' で復元
  };

  // [DEBUG] 保存直前のデータ内容を出力
  console.log('[saveGame] 保存データ:', JSON.parse(JSON.stringify(data)));

  try {
    const json = JSON.stringify(data);
    localStorage.setItem(SAVE_KEY, json);
    // [DEBUG] 保存成功 + 実際にストレージに書き込まれた文字列を確認
    const stored = localStorage.getItem(SAVE_KEY);
    console.log('[saveGame] 保存成功 ✓  key:', SAVE_KEY);
    console.log('[saveGame] ストレージ読み返し:', stored ? stored.slice(0, 120) + '…' : '（空）');
    return true;
  } catch (e) {
    // localStorage 容量超過など
    console.error('[saveGame] 保存に失敗しました:', e);
    return false;
  }
}

/**
 * localStorage からゲーム状態を復元する。
 * 成功時は true、データなし・バージョン不一致・解析失敗時は false を返す。
 * マップはすでに generateMap() で生成済みの前提で呼ぶこと。
 */
function loadGame() {
  const raw = localStorage.getItem(SAVE_KEY);
  // [DEBUG] getItem の生の結果を確認
  console.log('[loadGame] localStorage.getItem 結果:',
    raw === null ? 'null（データなし）' : raw.slice(0, 120) + '…');

  if (!raw) {
    console.log('[loadGame] セーブデータが存在しないため中断');
    return false;
  }

  let data;
  try {
    data = JSON.parse(raw);
    // [DEBUG] パース後のオブジェクトを確認
    console.log('[loadGame] JSON.parse 結果:', data);
  } catch (e) {
    console.error('[loadGame] JSON.parse 失敗:', e);
    return false;
  }

  // バージョンチェック
  if (!data || data.version !== 1) {
    console.warn('[loadGame] バージョン不一致のためロードをスキップします。data.version =', data?.version);
    return false;
  }

  // --- プレイヤーステータスの復元 ---
  const p = data.player;
  Object.assign(player, {
    hp:        p.hp,
    maxHp:     p.maxHp,
    mp:        p.mp,
    maxMp:     p.maxMp,
    lv:        p.lv,
    exp:       p.exp,
    atk:       p.atk,
    def:       p.def,
    coins:     p.coins,
    equip:     { weapon: p.equip.weapon, armor: p.equip.armor },
    inventory: (p.inventory || []).map(s => ({ itemId: s.itemId, qty: s.qty })),
    learnedAttacks: p.learnedAttacks || ['kougeki'],
    learnedMagics:  p.learnedMagics  || [],
  });

  // ボスクリアフラグ復元
  BOSS_EVENT.isDefeated = data.bossDefeated === true;

  // --- フィールド状態の復元 ---
  const f = data.field;
  field.px          = (typeof f.px === 'number') ? f.px : START_X;
  field.py          = (typeof f.py === 'number') ? f.py : START_Y;
  field.stepCount   = f.stepCount   || 0;
  field.encountSteps= f.encountSteps|| 20;
  field.facing      = f.facing      || 'down';
  field.camX        = 0; // 次フレームで renderField が再計算するため初期化
  field.camY        = 0;
  field.moving      = false;
  field.walkFrame   = 0;

  // --- ロード後は座標がマップ内に収まっているか安全チェック ---
  field.px = Math.max(0.5, Math.min(MAP_W - 1.5, field.px));
  field.py = Math.max(0.5, Math.min(MAP_H - 1.5, field.py));

  // --- UI 状態のリセット（メニュー・ショップを閉じる） ---
  townMenu.active = false; townMenu.town = null;
  townMenu.message = ''; townMenu.messageTimer = 0; townMenu.cursor = 0;
  shop.active = false; shop.message = ''; shop.messageTimer = 0;
  fieldMenu.active = false; fieldMenu.message = ''; fieldMenu.messageTimer = 0;

  mode = 'field';
  bgmSyncToMode('field');
  // [DEBUG] 復元後のプレイヤー状態を確認
  console.log('[loadGame] ロード成功 ✓  復元後 player:', JSON.parse(JSON.stringify(player)));
  console.log('[loadGame] 復元後 field.px:', field.px, 'field.py:', field.py, 'mode:', mode);
  return true;
}

/** セーブデータが存在するか確認するユーティリティ */
function hasSaveData() {
  try {
    const exists = localStorage.getItem(SAVE_KEY) !== null;
    // [DEBUG] タイトル画面が「つづきから」を表示するかの判定結果を確認
    console.log('[hasSaveData] key:', SAVE_KEY, '→', exists ? 'あり ✓' : 'なし ✗');
    return exists;
  } catch (e) {
    console.error('[hasSaveData] localStorage アクセスエラー:', e);
    return false;
  }
}

/** セーブデータを削除する（リセット時などに使用） */
function deleteSaveData() {
  try {
    localStorage.removeItem(SAVE_KEY);
  } catch (e) {
    console.warn('[deleteSaveData] 削除に失敗しました:', e);
  }
}

// ===== タイル描画（トップダウン：正方形タイル） =====
function drawIsoTile(sx, sy, top, lft, rgt) {
  // 上面（地面の色）を正方形で塗る
  ctx.fillStyle = top;
  ctx.fillRect(sx, sy, TW, TH);
  // 右側に1pxの影ライン（バイオームの縁取り）
  ctx.fillStyle = rgt;
  ctx.fillRect(sx + TW - 2, sy, 2, TH);
  // 下側に1pxの影ライン
  ctx.fillStyle = lft;
  ctx.fillRect(sx, sy + TH - 2, TW, 2);
}

function drawWaterTile(sx, sy, t) {
  const wave = Math.sin(t * 0.003 + sx * 0.05) * 1.5;
  // ベース
  ctx.fillStyle = '#3A8AAA';
  ctx.fillRect(sx, sy, TW, TH);
  // 光の揺らぎ
  ctx.fillStyle = `rgba(180,230,255,${0.15 + Math.abs(wave) * 0.06})`;
  ctx.fillRect(sx + 4, sy + 4 + wave, TW - 8, TH / 3);
}

function drawLavaTile(sx, sy, t) {
  const g = ctx.createLinearGradient(sx, sy, sx + TW, sy + TH);
  const flicker = 0.5 + Math.sin(t * 0.004 + sx * 0.05) * 0.3;
  g.addColorStop(0, `rgba(${Math.floor(200 + flicker*55)},30,0,1)`);
  g.addColorStop(1, `rgba(${Math.floor(160 + flicker*40)},10,0,1)`);
  ctx.fillStyle = g;
  ctx.fillRect(sx, sy, TW, TH);
  // 気泡
  if (Math.sin(t * 0.004 + sx * 0.1) > 0.92) {
    ctx.fillStyle = 'rgba(255,200,0,0.7)';
    ctx.beginPath();
    ctx.arc(sx + TW / 2 + Math.sin(t * 0.01) * 8, sy + TH / 2, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ===== フィールドオブジェクト描画 =====
function drawIsoObject(sx,sy,type) {
  switch(type) {
    case 'tree':         drawTree(sx,sy,'#5C3317','#7A4422',['#1A5E2A','#226B32','#2E8040']); break;
    case 'bigrock':      drawRock(sx,sy,'#777','#555','#666',1.3); break;
    case 'rock':         drawRock(sx,sy,'#888','#666','#777',1.0); break;
    case 'cactus':       drawCactus(sx,sy); break;
    case 'snowtree':     drawTree(sx,sy,'#8899AA','#9AAABB',['#DDEEFF','#C8E0F8','#AACCEE']); break;
    case 'icerock':      drawRock(sx,sy,'#99CCEE','#7799AA','#88BBDD',1.1); break;
    case 'lavarock':     drawRock(sx,sy,'#442211','#221108','#331810',1.2); break;
    case 'deadtree':     drawDeadTree(sx,sy); break;
    case 'palmtree':     drawPalmTree(sx,sy); break;
    case 'demon_castle': drawDemonCastle(sx,sy); break;
  }
}

function drawTree(sx,sy,trunkL,trunkR,leafCols) {
  const hw=TW/2;
  ctx.fillStyle=trunkL; ctx.fillRect(sx-4,sy-18,4,18);
  ctx.fillStyle=trunkR; ctx.fillRect(sx,sy-18,4,18);
  for (let i=0;i<3;i++) {
    const ly=sy-20-i*12, lhw=hw*(0.7-i*0.15), lhh=TH*(0.6-i*0.1);
    ctx.fillStyle=leafCols[i];
    ctx.beginPath(); ctx.moveTo(sx,ly-lhh); ctx.lineTo(sx+lhw,ly);
    ctx.lineTo(sx,ly+lhh); ctx.lineTo(sx-lhw,ly); ctx.closePath(); ctx.fill();
  }
}

function drawRock(sx,sy,top,lft,rgt,scale=1.0) {
  const hw=TW*0.35*scale, hh=TH*0.5*scale;
  ctx.fillStyle=top;
  ctx.beginPath(); ctx.moveTo(sx,sy-hh-6*scale); ctx.lineTo(sx+hw,sy-3*scale);
  ctx.lineTo(sx,sy+hh-4*scale); ctx.lineTo(sx-hw,sy-3*scale); ctx.closePath(); ctx.fill();
  ctx.fillStyle=lft;
  ctx.beginPath(); ctx.moveTo(sx-hw,sy-3*scale); ctx.lineTo(sx,sy+hh-4*scale);
  ctx.lineTo(sx,sy+hh); ctx.lineTo(sx-hw,sy+scale); ctx.closePath(); ctx.fill();
  ctx.fillStyle=rgt;
  ctx.beginPath(); ctx.moveTo(sx+hw,sy-3*scale); ctx.lineTo(sx,sy+hh-4*scale);
  ctx.lineTo(sx,sy+hh); ctx.lineTo(sx+hw,sy+scale); ctx.closePath(); ctx.fill();
}

function drawCactus(sx,sy) {
  ctx.fillStyle='#2A7A2A';
  ctx.fillRect(sx-3,sy-28,6,28); // 幹
  ctx.fillRect(sx-10,sy-22,7,5); // 左腕
  ctx.fillRect(sx-10,sy-28,5,9);
  ctx.fillRect(sx+3,sy-20,7,5);  // 右腕
  ctx.fillRect(sx+5,sy-28,5,9);
  ctx.fillStyle='#3A9A3A';
  ctx.fillRect(sx-2,sy-30,4,5);  // 先端
}

function drawDeadTree(sx,sy) {
  ctx.fillStyle='#5A4030';
  ctx.fillRect(sx-3,sy-24,6,24);
  ctx.fillStyle='#4A3020';
  ctx.fillRect(sx-3,sy-24,3,24);
  // 枯れ枝
  ctx.strokeStyle='#5A4030'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(sx,sy-20); ctx.lineTo(sx-12,sy-28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(sx,sy-16); ctx.lineTo(sx+10,sy-23); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(sx,sy-12); ctx.lineTo(sx-8,sy-18); ctx.stroke();
}

function drawPalmTree(sx,sy) {
  // 曲がった幹
  ctx.fillStyle='#8B6914';
  for (let i=0;i<5;i++) {
    ctx.fillRect(sx-2+i*0.5,sy-i*6,4,6);
  }
  // ヤシの葉（放射状）
  ctx.strokeStyle='#2A8A1A'; ctx.lineWidth=3;
  const tx=sx+2, ty=sy-28;
  for (let a=0;a<6;a++) {
    const ang=-Math.PI/2+(a-2.5)*0.5;
    ctx.beginPath(); ctx.moveTo(tx,ty);
    ctx.lineTo(tx+Math.cos(ang)*18, ty+Math.sin(ang)*8); ctx.stroke();
  }
}

// ===== 魔王城（Demon King Castle）描画 =====
// アイソメトリックで通常建物の4倍サイズ。禍々しい黒×紫のシルエット。
// sx,sy はタイルの画面中心座標。
function drawDemonCastle(sx, sy) {
  const now = Date.now();

  // ---- 影（地面投影） ----
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(sx, sy + 6, 52, 18, 0, 0, Math.PI * 2);
  ctx.fill();

  // ---- 基壇（土台ブロック：アイソメ台形） ----
  ctx.fillStyle = '#1A0A1A'; // 黒紫
  ctx.beginPath();
  ctx.moveTo(sx,      sy - 10);
  ctx.lineTo(sx + 48, sy + 14);
  ctx.lineTo(sx,      sy + 38);
  ctx.lineTo(sx - 48, sy + 14);
  ctx.closePath();
  ctx.fill();
  // 基壇・左面
  ctx.fillStyle = '#0E0510';
  ctx.beginPath();
  ctx.moveTo(sx - 48, sy + 14);
  ctx.lineTo(sx,      sy + 38);
  ctx.lineTo(sx,      sy + 50);
  ctx.lineTo(sx - 48, sy + 26);
  ctx.closePath();
  ctx.fill();
  // 基壇・右面
  ctx.fillStyle = '#160818';
  ctx.beginPath();
  ctx.moveTo(sx + 48, sy + 14);
  ctx.lineTo(sx,      sy + 38);
  ctx.lineTo(sx,      sy + 50);
  ctx.lineTo(sx + 48, sy + 26);
  ctx.closePath();
  ctx.fill();

  // ---- 本城壁（中央の大きな四角い建物） ----
  const wallTop = sy - 56;
  // 壁・左面
  ctx.fillStyle = '#1E0A22';
  ctx.beginPath();
  ctx.moveTo(sx - 28, sy + 10);
  ctx.lineTo(sx,      sy - 6);
  ctx.lineTo(sx,      wallTop);
  ctx.lineTo(sx - 28, wallTop + 16);
  ctx.closePath();
  ctx.fill();
  // 壁・右面
  ctx.fillStyle = '#2A0C30';
  ctx.beginPath();
  ctx.moveTo(sx + 28, sy + 10);
  ctx.lineTo(sx,      sy - 6);
  ctx.lineTo(sx,      wallTop);
  ctx.lineTo(sx + 28, wallTop + 16);
  ctx.closePath();
  ctx.fill();
  // 壁・天面
  ctx.fillStyle = '#3A1040';
  ctx.beginPath();
  ctx.moveTo(sx,       wallTop);
  ctx.lineTo(sx - 28,  wallTop + 16);
  ctx.lineTo(sx,       wallTop + 32);
  ctx.lineTo(sx + 28,  wallTop + 16);
  ctx.closePath();
  ctx.fill();

  // ---- 中央の大塔（高い四角い尖塔） ----
  const towerH = 68;
  const towerTop = wallTop - towerH;
  // 塔・左面
  ctx.fillStyle = '#220830';
  ctx.beginPath();
  ctx.moveTo(sx - 12, wallTop + 8);
  ctx.lineTo(sx,      wallTop);
  ctx.lineTo(sx,      towerTop);
  ctx.lineTo(sx - 12, towerTop + 8);
  ctx.closePath();
  ctx.fill();
  // 塔・右面
  ctx.fillStyle = '#300A3E';
  ctx.beginPath();
  ctx.moveTo(sx + 12, wallTop + 8);
  ctx.lineTo(sx,      wallTop);
  ctx.lineTo(sx,      towerTop);
  ctx.lineTo(sx + 12, towerTop + 8);
  ctx.closePath();
  ctx.fill();
  // 塔・天面
  ctx.fillStyle = '#4A1258';
  ctx.beginPath();
  ctx.moveTo(sx,      towerTop);
  ctx.lineTo(sx - 12, towerTop + 8);
  ctx.lineTo(sx,      towerTop + 16);
  ctx.lineTo(sx + 12, towerTop + 8);
  ctx.closePath();
  ctx.fill();

  // ---- 尖塔の先端（とがった屋根）----
  // 左面
  ctx.fillStyle = '#5A0A6A';
  ctx.beginPath();
  ctx.moveTo(sx - 12, towerTop + 8);
  ctx.lineTo(sx,      towerTop - 20);
  ctx.lineTo(sx,      towerTop + 16);
  ctx.closePath();
  ctx.fill();
  // 右面
  ctx.fillStyle = '#6E0C80';
  ctx.beginPath();
  ctx.moveTo(sx + 12, towerTop + 8);
  ctx.lineTo(sx,      towerTop - 20);
  ctx.lineTo(sx,      towerTop + 16);
  ctx.closePath();
  ctx.fill();

  // ---- 左右の小塔 ----
  function drawMinorTower(ox, oy) {
    const mTop = oy - 32;
    ctx.fillStyle = '#1E0828';
    ctx.beginPath();
    ctx.moveTo(ox - 6, oy + 4);
    ctx.lineTo(ox,     oy);
    ctx.lineTo(ox,     mTop);
    ctx.lineTo(ox - 6, mTop + 4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#2A0C38';
    ctx.beginPath();
    ctx.moveTo(ox + 6, oy + 4);
    ctx.lineTo(ox,     oy);
    ctx.lineTo(ox,     mTop);
    ctx.lineTo(ox + 6, mTop + 4);
    ctx.closePath();
    ctx.fill();
    // 小塔の屋根（三角）
    ctx.fillStyle = '#440880';
    ctx.beginPath();
    ctx.moveTo(ox - 6, mTop + 4);
    ctx.lineTo(ox,     mTop - 12);
    ctx.lineTo(ox + 6, mTop + 4);
    ctx.closePath();
    ctx.fill();
  }
  drawMinorTower(sx - 26, wallTop + 14);
  drawMinorTower(sx + 26, wallTop + 14);

  // ---- 城門（中央下部） ----
  ctx.fillStyle = '#0A0010';
  // アーチ型
  ctx.beginPath();
  ctx.arc(sx, sy - 4, 7, Math.PI, 0, false);
  ctx.lineTo(sx + 7, sy + 6);
  ctx.lineTo(sx - 7, sy + 6);
  ctx.closePath();
  ctx.fill();

  // ---- 窓（青紫の輝き） ----
  const glowAlpha = 0.5 + Math.sin(now * 0.002) * 0.3; // 脈動
  ctx.fillStyle = `rgba(140,0,200,${glowAlpha})`;
  // 左塔の窓
  ctx.beginPath(); ctx.ellipse(sx - 24, wallTop + 6, 3, 4, 0, 0, Math.PI * 2); ctx.fill();
  // 右塔の窓
  ctx.beginPath(); ctx.ellipse(sx + 24, wallTop + 6, 3, 4, 0, 0, Math.PI * 2); ctx.fill();
  // 大塔の窓（2つ）
  ctx.beginPath(); ctx.ellipse(sx - 4, wallTop - 20, 2.5, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(sx + 4, wallTop - 20, 2.5, 4, 0, 0, Math.PI * 2); ctx.fill();

  // ---- 尖塔頂上のオーラ（揺れる紫炎） ----
  const flameY = towerTop - 22;
  for (let i = 0; i < 3; i++) {
    const flicker = Math.sin(now * 0.004 + i * 2.1) * 3;
    const fa = 0.4 + Math.sin(now * 0.005 + i) * 0.2;
    ctx.fillStyle = `rgba(180,0,255,${fa})`;
    ctx.beginPath();
    ctx.ellipse(sx + flicker, flameY - i * 4, 4 - i, 5 + i, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ===== 村の家（アイソメトリック3D） =====
function drawVillage(sx, sy, name) {
  // 家（メイン）
  // 壁・左面
  ctx.fillStyle='#D4A870';
  ctx.beginPath();
  ctx.moveTo(sx-20, sy-10);
  ctx.lineTo(sx,    sy+0);
  ctx.lineTo(sx,    sy+20);
  ctx.lineTo(sx-20, sy+10);
  ctx.closePath(); ctx.fill();
  // 壁・右面
  ctx.fillStyle='#C49060';
  ctx.beginPath();
  ctx.moveTo(sx,    sy+0);
  ctx.lineTo(sx+20, sy-10);
  ctx.lineTo(sx+20, sy+10);
  ctx.lineTo(sx,    sy+20);
  ctx.closePath(); ctx.fill();
  // 屋根（左）
  ctx.fillStyle='#CC4422';
  ctx.beginPath();
  ctx.moveTo(sx-20, sy-10);
  ctx.lineTo(sx,    sy-22);
  ctx.lineTo(sx,    sy+0);
  ctx.closePath(); ctx.fill();
  // 屋根（右）
  ctx.fillStyle='#AA3318';
  ctx.beginPath();
  ctx.moveTo(sx+20, sy-10);
  ctx.lineTo(sx,    sy-22);
  ctx.lineTo(sx,    sy+0);
  ctx.closePath(); ctx.fill();
  // 屋根（天面）
  ctx.fillStyle='#EE5533';
  ctx.beginPath();
  ctx.moveTo(sx,    sy-22);
  ctx.lineTo(sx-20, sy-10);
  ctx.lineTo(sx,    sy-2);
  ctx.lineTo(sx+20, sy-10);
  ctx.closePath(); ctx.fill();
  // 扉
  ctx.fillStyle='#7A4A20';
  ctx.fillRect(sx-4, sy+6, 8, 14);
  // 窓（左面）
  ctx.fillStyle='#AADDFF';
  ctx.fillRect(sx-15, sy-4, 6, 6);
  // 旗（緑）
  ctx.fillStyle='#228833';
  ctx.fillRect(sx-1, sy-30, 2, 10);
  ctx.beginPath();
  ctx.moveTo(sx+1, sy-30); ctx.lineTo(sx+8, sy-26); ctx.lineTo(sx+1, sy-22);
  ctx.closePath(); ctx.fill();

  // 名前ラベル
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.fillRect(sx - ctx.measureText(name).width/2 - 4, sy+20, ctx.measureText(name).width+8, 14);
  ctx.fillStyle='#FFEE88'; ctx.font='17px monospace'; ctx.textAlign='center';
  ctx.fillText(name, sx, sy+30); ctx.textAlign='left';
}

// ===== バイオーム別の空・地平線 =====
const BIOME_SKY = [
  // 0 平原
  {sky0:'#1A3A6A',sky1:'#3A6A9A',hor:'#1B4D3E',base:'#2A5C3A'},
  // 1 森
  {sky0:'#0A2A1A',sky1:'#1A5A2A',hor:'#0A3A10',base:'#1A4A20'},
  // 2 砂漠
  {sky0:'#8A5A00',sky1:'#D4A020',hor:'#B87820',base:'#C4A040'},
  // 3 雪原
  {sky0:'#8899CC',sky1:'#BBCCEE',hor:'#AABBDD',base:'#D0E0F0'},
  // 4 火山
  {sky0:'#220000',sky1:'#660A00',hor:'#3A1000',base:'#1A0808'},

  {sky0:'#1A2A10',sky1:'#2A4A18',hor:'#1A3A10',base:'#283820'},
