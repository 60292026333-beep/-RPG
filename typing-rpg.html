function drawFieldSky(biome) {
  const s = BIOME_SKY[biome] || BIOME_SKY[0];
  const g = ctx.createLinearGradient(0,0,0,H*0.38);
  g.addColorStop(0,s.sky0); g.addColorStop(1,s.sky1);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H*0.38);

  // 星（雪原・夜っぽいバイオームのみ）
  if (biome===BIOME.SNOW||biome===BIOME.VOLCANO||biome===BIOME.SWAMP||biome===BIOME.PLAIN) {
    ctx.fillStyle='#FFFFFF';
    const stars=[30,8,90,18,150,5,220,22,290,10,360,20,430,7,60,30,180,28,310,32,400,25,470,15];
    for (let i=0;i<stars.length;i+=2) {
      ctx.globalAlpha=0.5+Math.sin(Date.now()*0.001+i)*0.3;
      ctx.fillRect(stars[i],stars[i+1],1.5,1.5);
    }
    ctx.globalAlpha=1;
  }

  // 火山：飛び散る火の粉
  if (biome===BIOME.VOLCANO) {
    ctx.fillStyle='#FF6600';
    const t=Date.now()*0.001;
    for (let i=0;i<8;i++) {
      const px2=((Math.sin(t*0.7+i*1.3)*0.5+0.5)*W)|0;
      const py2=(H*0.2+Math.sin(t*1.1+i)*H*0.1)|0;
      ctx.globalAlpha=0.4+Math.sin(t+i)*0.3;
      ctx.beginPath(); ctx.arc(px2,py2,2,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  // 地平線の山
  ctx.fillStyle=s.hor;
  ctx.beginPath(); ctx.moveTo(0,H*0.38);
  const peaks=[[0,0.30],[W*0.11,0.20],[W*0.22,0.30],[W*0.33,0.16],[W*0.44,0.26],[W*0.55,0.18],[W*0.66,0.28],[W*0.75,0.22]];
  peaks.forEach(([px2,py2])=>ctx.lineTo(px2,H*py2));
  ctx.lineTo(W,H*0.38); ctx.closePath(); ctx.fill();

  // 地面ベース色
  ctx.fillStyle=s.base; ctx.fillRect(0,H*0.38,W,H);
}

// ===== アイソメトリックフィールド描画 =====
function drawIsoField(camX,camY,walkFrame,facing) {
  const biome=getCurrentBiome();
  drawFieldSky(biome);

  const clipY=H-120;
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,clipY); ctx.clip();

  const now=Date.now();

  for (let ty=0;ty<MAP_H;ty++) {
    for (let tx=0;tx<MAP_W;tx++) {
      const {sx,sy}=isoToScreen(tx,ty,camX,camY);
      if (sx<-TW||sx>W+TW||sy<-TH||sy>clipY+TH) continue;
      const tid=mapTiles[ty][tx];
      if (tid===70) { drawWaterTile(sx,sy,now); continue; }
      if (tid===71) { drawLavaTile(sx,sy,now); continue; }
      const def=TILE_DEF[tid];
      if (def) drawIsoTile(sx,sy,def.top,def.lft,def.rgt);
    }
  }

  // オブジェクト＋プレイヤー奥行きソート（Yが大きい＝手前）
  const playerDepth=field.py;
  const visObjs=mapObjects.filter(o=>{
    const {sx,sy}=isoToScreen(o.tx,o.ty,camX,camY);
    return sx>-TW*2&&sx<W+TW*2&&sy>-80&&sy<clipY+80;
  }).sort((a,b)=>a.ty-b.ty);

  // 村・宿も同じ奥行きリストに混ぜて描画
  const visTowns=mapTowns.filter(t=>{
    const {sx,sy}=isoToScreen(t.tx,t.ty,camX,camY);
    return sx>-TW*3&&sx<W+TW*3&&sy>-100&&sy<clipY+100;
  });
  const allObjs=[...visObjs, ...visTowns].sort((a,b)=>a.ty-b.ty);

  let playerDrawn=false;
  for (const obj of allObjs) {
    if (!playerDrawn && obj.ty>=playerDepth) {
      const {sx:px2,sy:py2}=isoToScreen(field.px,field.py,camX,camY);
      drawIsoPlayer(px2+TW/2,py2+TH/2,walkFrame,facing);
      playerDrawn=true;
    }
    const {sx,sy}=isoToScreen(obj.tx,obj.ty,camX,camY);
    if (obj.type==='village') drawVillage(sx+TW/2,sy+TH/2,obj.name);
    else if (obj.type==='inn') drawInn(sx+TW/2,sy+TH/2,obj.name);
    else drawIsoObject(sx+TW/2,sy+TH/2,obj.type);
  }
  if (!playerDrawn) {
    const {sx:px2,sy:py2}=isoToScreen(field.px,field.py,camX,camY);
    drawIsoPlayer(px2+TW/2,py2+TH/2,walkFrame,facing);
  }

  ctx.restore();
}

// ===== プレイヤー描画（トップダウン視点）=====
function drawIsoPlayer(sx, sy, walkFrame, facing) {
  // 影
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(sx, sy+4, 9, 5, 0, 0, Math.PI*2); ctx.fill();

  // 足（歩行アニメ）
  ctx.fillStyle = '#5C3317';
  if (facing === 'down' || facing === 'up') {
    const legOff = walkFrame===0 ? 0 : 2;
    ctx.fillRect(sx-6, sy+4+legOff,  5, 6);
    ctx.fillRect(sx+1, sy+4-legOff,  5, 6);
  } else {
    const legOff = walkFrame===0 ? 0 : 2;
    ctx.fillRect(sx-4, sy+3+legOff,  4, 6);
    ctx.fillRect(sx+0, sy+3-legOff,  4, 6);
  }

  // 胴体（青いマント）
  ctx.fillStyle = '#2266CC';
  ctx.beginPath(); ctx.ellipse(sx, sy-2, 9, 11, 0, 0, Math.PI*2); ctx.fill();

  // マント縁（赤）
  ctx.strokeStyle = '#CC4400'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(sx, sy-2, 9, 11, 0, 0, Math.PI*2); ctx.stroke();

  // 頭
  ctx.fillStyle = '#F4C07A';
  ctx.beginPath(); ctx.ellipse(sx, sy-12, 7, 7, 0, 0, Math.PI*2); ctx.fill();

  // 髪
  ctx.fillStyle = '#3A2010';
  ctx.beginPath(); ctx.ellipse(sx, sy-15, 7, 5, 0, Math.PI, Math.PI*2); ctx.fill();

  // 目（向きに応じて位置変更）
  ctx.fillStyle = '#000';
  if (facing === 'down') {
    ctx.fillRect(sx-3, sy-12, 2, 2);
    ctx.fillRect(sx+1, sy-12, 2, 2);
  } else if (facing === 'up') {
    // 後ろ向き：目なし
  } else if (facing === 'left') {
    ctx.fillRect(sx-4, sy-13, 2, 2);
  } else {
    ctx.fillRect(sx+2, sy-13, 2, 2);
  }
}

// ===== 敵描画（全モンスター対応） =====
function drawEnemy(e) {
  const now = Date.now();
  // ===== キャラクタースケール（1.5倍・サイズアップ） =====
  const SCALE = 1.5;

  // ===== 待機アニメーション =====
  // 浮遊：2秒周期で上下±7px（1.5倍スケールに合わせ増幅）
  const floatY  = Math.sin(now * 0.003) * 7;
  // 脈動（幅±2.5%、高±2%）
  const pulseX  = 1 + Math.sin(now * 0.0025) * 0.025;
  const pulseY  = 1 + Math.cos(now * 0.0025) * 0.02;

  // ===== シェイク（1.5倍スケールに合わせて振れ幅も増幅） =====
  const shakeX  = calcShake(battle.enemyShake, 12);
  if (battle.enemyShake > 0) battle.enemyShake--;

  // 描画基準点（アニメ込み・スケールアップ分調整）
  const cx = W/2 + 40 + shakeX;
  const cy = H * 0.15 + floatY;

  ctx.save();
  // 脈動スケール × 全体 1.5 倍スケール（キャラクタ中心を基準に）
  ctx.translate(cx, cy + 40);
  ctx.scale(pulseX * SCALE, pulseY * SCALE);
  ctx.translate(-cx, -(cy + 40));

  switch (e.shape || 'slime') {
    case 'slime':      drawEnemySlime(cx, cy, e.color, now);      break;
    case 'wolf':       drawEnemyWolf(cx, cy, e.color, now);       break;
    case 'dragon':     drawEnemyDragon(cx, cy, e.color, now);     break;
    case 'ghost':      drawEnemyGhost(cx, cy, e.color, now);      break;
    case 'goblin':     drawEnemyGoblin(cx, cy, e.color, now);     break;
    case 'golem':      drawEnemyGolem(cx, cy, e.color, now);      break;
    case 'worm':       drawEnemyWorm(cx, cy, e.color, now);       break;
    case 'scorpion':   drawEnemyScorpion(cx, cy, e.color, now);   break;
    case 'mummy':      drawEnemyMummy(cx, cy, e.color, now);      break;
    case 'dryad':      drawEnemyDryad(cx, cy, e.color, now);      break;
    case 'salamander': drawEnemySalamander(cx, cy, e.color, now); break;
    case 'wisp':       drawEnemyWisp(cx, cy, e.color, now);       break;
    case 'kraken':     drawEnemyKraken(cx, cy, e.color, now);     break;
    case 'demon_king': drawEnemyDemonKing(cx, cy, now);           break;
    default:           drawEnemySlime(cx, cy, e.color, now);      break;
  }

  // ===== 被弾フラッシュ（赤半透明オーバーレイ） =====
  if (battle.enemyHitFlash > 0) {
    battle.enemyHitFlash--;
    ctx.globalAlpha = battle.enemyHitFlash / 8 * 0.55;
    ctx.fillStyle = '#FF2200';
    ctx.fillRect(cx - 60, cy - 10, 120, 100);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

// ===== グラデーション生成ヘルパー =====
function radGrad(cx, cy, r0, r1, c0, c1) {
  const g = ctx.createRadialGradient(cx, cy, r0, cx, cy, r1);
  g.addColorStop(0, c0); g.addColorStop(1, c1); return g;
}
function linGrad(x0, y0, x1, y1, stops) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  stops.forEach(([t, c]) => g.addColorStop(t, c)); return g;
}

function drawEnemySlime(cx, cy, col, now) {
  // 影
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(cx, cy + 72, 26, 6, 0, 0, Math.PI * 2); ctx.fill();

  // ボディ（放射グラデーション：中心は明るい）
  const sg = radGrad(cx - 8, cy + 22, 4, 32, '#FFFFFF40', col);
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.arc(cx, cy + 30, 30, Math.PI, 0, false);
  ctx.quadraticCurveTo(cx + 32, cy + 72, cx, cy + 68);
  ctx.quadraticCurveTo(cx - 32, cy + 72, cx - 30, cy + 30);
  ctx.fill();

  // ハイライト
  ctx.fillStyle = 'rgba(255,255,255,0.32)';
  ctx.beginPath(); ctx.ellipse(cx - 10, cy + 22, 10, 7, -0.5, 0, Math.PI * 2); ctx.fill();

  // 目（白目→黒目→ハイライト）
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath(); ctx.arc(cx - 10, cy + 25, 8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 10, cy + 25, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = col;
  const eyeShift = Math.sin(now * 0.002) * 1.5; // 目がわずかに動く
  ctx.beginPath(); ctx.arc(cx - 8 + eyeShift, cy + 27, 5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 12 + eyeShift, cy + 27, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath(); ctx.arc(cx - 6 + eyeShift, cy + 25, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 14 + eyeShift, cy + 25, 1.5, 0, Math.PI * 2); ctx.fill();

  // 触角
  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.lineCap = 'round';
  const wa = Math.sin(now * 0.004) * 4;
  ctx.beginPath(); ctx.moveTo(cx - 5, cy); ctx.lineTo(cx - 8 - wa, cy - 16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 5, cy); ctx.lineTo(cx + 8 + wa, cy - 16); ctx.stroke();
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(cx - 8 - wa, cy - 16, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 8 + wa, cy - 16, 3, 0, Math.PI * 2); ctx.fill();
}

function drawEnemyWolf(cx, cy, col, now) {
  // 影
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(cx, cy + 78, 28, 6, 0, 0, Math.PI * 2); ctx.fill();

  const tailWag = Math.sin(now * 0.005) * 18;
  ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - 26, cy + 38);
  ctx.quadraticCurveTo(cx - 48 + tailWag * 0.5, cy + 24, cx - 38 + tailWag, cy + 14);
  ctx.stroke();

  // 胴
  const bodyG = radGrad(cx - 5, cy + 35, 5, 30, _lighten(col, 0.4), col);
  ctx.fillStyle = bodyG;
  ctx.beginPath(); ctx.ellipse(cx, cy + 40, 28, 18, 0, 0, Math.PI * 2); ctx.fill();

  // 頭
  ctx.fillStyle = linGrad(cx + 5, cy + 10, cx + 35, cy + 35,
    [[0, _lighten(col, 0.3)], [1, col]]);
  ctx.beginPath(); ctx.ellipse(cx + 20, cy + 22, 18, 14, 0.3, 0, Math.PI * 2); ctx.fill();

  // 耳
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(cx + 18, cy + 10); ctx.lineTo(cx + 10, cy - 2); ctx.lineTo(cx + 28, cy + 8); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx + 30, cy + 12); ctx.lineTo(cx + 26, cy); ctx.lineTo(cx + 38, cy + 10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,160,160,0.5)'; // 耳の内側
  ctx.beginPath(); ctx.moveTo(cx + 18, cy + 9); ctx.lineTo(cx + 12, cy + 0); ctx.lineTo(cx + 25, cy + 8); ctx.closePath(); ctx.fill();

  // 目
  ctx.fillStyle = '#FF8800';
  ctx.beginPath(); ctx.arc(cx + 24, cy + 20, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(cx + 25, cy + 20, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#FFF';
  ctx.beginPath(); ctx.arc(cx + 24, cy + 18.5, 1, 0, Math.PI * 2); ctx.fill();

  // 鼻
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.ellipse(cx + 35, cy + 26, 4, 3, 0, 0, Math.PI * 2); ctx.fill();

  // 脚
  ctx.fillStyle = col;
  ctx.fillRect(cx - 20, cy + 55, 8, 20); ctx.fillRect(cx - 6, cy + 55, 8, 20);
  ctx.fillRect(cx + 8,  cy + 55, 8, 20); ctx.fillRect(cx + 20, cy + 55, 8, 20);
  // 爪
  ctx.fillStyle = '#DDCCAA';
  for (let i = 0; i < 4; i++) {
    const lx = [cx - 22, cx - 8, cx + 6, cx + 18];
    ctx.fillRect(lx[i], cy + 74, 3, 4); ctx.fillRect(lx[i] + 4, cy + 74, 3, 4);
  }
}

function drawEnemyDragon(cx, cy, col, now) {
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(cx, cy + 72, 30, 7, 0, 0, Math.PI * 2); ctx.fill();

  const wFlap = Math.sin(now * 0.004) * 8;
  // 翼
  const wingCol = _darken(col, 0.3);
  ctx.fillStyle = wingCol;
  ctx.beginPath(); ctx.moveTo(cx - 28, cy + 25); ctx.lineTo(cx - 55 - wFlap, cy + 5); ctx.lineTo(cx - 52 - wFlap, cy + 55); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx + 28, cy + 25); ctx.lineTo(cx + 55 + wFlap, cy + 5); ctx.lineTo(cx + 52 + wFlap, cy + 55); ctx.closePath(); ctx.fill();
  // 翼の膜
  ctx.fillStyle = `${col}88`;
  ctx.beginPath(); ctx.moveTo(cx - 28, cy + 25); ctx.lineTo(cx - 55 - wFlap, cy + 5); ctx.lineTo(cx - 15, cy + 12); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx + 28, cy + 25); ctx.lineTo(cx + 55 + wFlap, cy + 5); ctx.lineTo(cx + 15, cy + 12); ctx.closePath(); ctx.fill();

  // 胴
  ctx.fillStyle = linGrad(cx, cy, cx, cy + 65, [[0, _lighten(col, 0.25)], [1, _darken(col, 0.2)]]);
  ctx.beginPath(); ctx.moveTo(cx, cy + 5); ctx.lineTo(cx - 28, cy + 65); ctx.lineTo(cx + 28, cy + 65); ctx.closePath(); ctx.fill();
  // 頭
  ctx.fillStyle = col;
  ctx.fillRect(cx - 18, cy - 15, 36, 28);
  // うろこ模様
  ctx.fillStyle = _darken(col, 0.2);
  for (let i = 0; i < 3; i++) ctx.fillRect(cx - 14 + i * 10, cy - 8, 7, 6);

  // 目（黄色・光る）
  ctx.fillStyle = '#FFEE00';
  ctx.beginPath(); ctx.arc(cx - 8, cy - 4, 5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 8, cy - 4, 5, 0, Math.PI * 2); ctx.fill();
  const glowA = 0.4 + Math.sin(now * 0.003) * 0.2;
  ctx.fillStyle = `rgba(255,220,0,${glowA})`;
  ctx.beginPath(); ctx.arc(cx - 8, cy - 4, 8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 8, cy - 4, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(cx - 7, cy - 4, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 9, cy - 4, 3, 0, Math.PI * 2); ctx.fill();

  // 火炎（口から）
  const fA = Math.abs(Math.sin(now * 0.005)) * 0.8;
  if (fA > 0.2) {
    ctx.fillStyle = `rgba(255,150,0,${fA * 0.7})`;
    ctx.beginPath(); ctx.ellipse(cx + 24, cy - 8, 14 * fA, 6 * fA, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(255,255,100,${fA * 0.5})`;
    ctx.beginPath(); ctx.ellipse(cx + 22, cy - 8, 8 * fA, 3 * fA, 0.3, 0, Math.PI * 2); ctx.fill();
  }
}

function drawEnemyGhost(cx, cy, col, now) {
  const t = now * 0.002;
  const drift = Math.sin(t) * 4;

  ctx.globalAlpha = 0.82 + Math.sin(t * 1.3) * 0.08;
  // 外側グロー
  ctx.fillStyle = radGrad(cx + drift, cy + 25, 5, 35, col + 'AA', col + '00');
  ctx.beginPath(); ctx.arc(cx + drift, cy + 20, 35, 0, Math.PI * 2); ctx.fill();

  // 本体
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.arc(cx + drift, cy + 20, 28, Math.PI, 0, false);
  ctx.lineTo(cx + drift + 28, cy + 72);
  for (let i = 5; i >= 0; i--) {
    ctx.lineTo(cx + drift + 28 - (5 - i) * 9.3, cy + 62 + (i % 2 === 0 ? 10 : 0));
  }
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;

  // 目（深紫）
  ctx.fillStyle = '#220044';
  ctx.beginPath(); ctx.arc(cx - 10 + drift, cy + 15, 6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 10 + drift, cy + 15, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#AAAAFF';
  ctx.beginPath(); ctx.arc(cx - 9 + drift, cy + 14, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 11 + drift, cy + 14, 2.5, 0, Math.PI * 2); ctx.fill();
}

function drawEnemyGoblin(cx, cy, col, now) {
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(cx, cy + 62, 18, 5, 0, 0, Math.PI * 2); ctx.fill();

  // 脚
  ctx.fillStyle = _darken(col, 0.15);
  ctx.fillRect(cx - 9, cy + 42, 8, 20); ctx.fillRect(cx + 1, cy + 42, 8, 20);

  // 胴
  ctx.fillStyle = linGrad(cx, cy + 22, cx, cy + 44, [[0, _lighten(col, 0.2)], [1, col]]);
  ctx.fillRect(cx - 10, cy + 22, 20, 22);

  // 腕（ぷらぷら揺れる）
  const armSwing = Math.sin(now * 0.003) * 5;
  ctx.fillStyle = col;
  ctx.fillRect(cx - 20, cy + 24 + armSwing * 0.5, 8, 16);
  ctx.fillRect(cx + 12, cy + 24 - armSwing * 0.5, 8, 16);

  // 頭
  ctx.fillStyle = linGrad(cx, cy, cx, cy + 26, [[0, _lighten(col, 0.3)], [1, col]]);
  ctx.beginPath(); ctx.ellipse(cx, cy + 12, 14, 12, 0, 0, Math.PI * 2); ctx.fill();

  // 耳（大きい）
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(cx - 16, cy + 10, 7, 5, 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 16, cy + 10, 7, 5, -0.5, 0, Math.PI * 2); ctx.fill();

  // 目（赤く光る）
  const eyeGlow = 0.7 + Math.sin(now * 0.004) * 0.3;
  ctx.fillStyle = `rgba(255,30,0,${eyeGlow})`;
  ctx.beginPath(); ctx.arc(cx - 5, cy + 10, 5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 5, cy + 10, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(cx - 4, cy + 10, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 6, cy + 10, 2.5, 0, Math.PI * 2); ctx.fill();

  // 牙
  ctx.fillStyle = '#FFFFCC';
  ctx.beginPath(); ctx.moveTo(cx - 3, cy + 18); ctx.lineTo(cx - 1, cy + 22); ctx.lineTo(cx + 1, cy + 18); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx + 2, cy + 18); ctx.lineTo(cx + 4, cy + 22); ctx.lineTo(cx + 6, cy + 18); ctx.fill();
}

function drawEnemyGolem(cx, cy, col, now) {
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(cx, cy + 82, 30, 8, 0, 0, Math.PI * 2); ctx.fill();

  // 脚
  ctx.fillStyle = linGrad(cx, cy + 58, cx, cy + 78, [[0, col], [1, _darken(col, 0.3)]]);
  ctx.fillRect(cx - 14, cy + 58, 12, 22); ctx.fillRect(cx + 2, cy + 58, 12, 22);

  // 胴

function drawEnemyWisp(cx, cy, col, now) {
  const t = now * 0.003;
  const wx = cx + Math.sin(t) * 8;
  const wy = cy + 30 + Math.cos(t * 0.9) * 6;

  // 外側グロー（3層）
  for (let r2 = 3; r2 >= 1; r2--) {
    ctx.fillStyle = col;
    ctx.globalAlpha = 0.12 * r2;
    ctx.beginPath(); ctx.arc(wx, wy, 24 * r2 / 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // コア（白→コア色グラデーション）
  ctx.fillStyle = radGrad(wx - 4, wy - 4, 2, 12, '#FFFFFF', col);
  ctx.beginPath(); ctx.arc(wx, wy, 12, 0, Math.PI * 2); ctx.fill();

  // 中心の白点
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath(); ctx.arc(wx, wy, 5, 0, Math.PI * 2); ctx.fill();

  // 軌跡パーティクル
  for (let i = 1; i <= 5; i++) {
    const ang = t - i * 0.5;
    const tx2 = cx + Math.sin(ang) * 8 * 1.3;
    const ty2 = cy + 30 + Math.cos(ang * 0.9) * 6 * 1.3;
    ctx.fillStyle = col;
    ctx.globalAlpha = 0.4 / i;
    ctx.beginPath(); ctx.arc(tx2, ty2, Math.max(1, 5 - i * 0.8), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

  // 前触手（3本、頭の前）

    const ang = -Math.PI / 2 + (i - 1) * 0.6 + 0.1;
    const wave = Math.sin(now * 0.003 + i * 1.5 + 1) * 8;

  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(cx - 11 + pupilShift, cy + 24, 5.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 13 + pupilShift, cy + 24, 5.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#FFF';
  ctx.beginPath(); ctx.arc(cx - 9 + pupilShift, cy + 22, 2, 0, Math.PI * 2); ctx.fill();

  ctx.strokeStyle = '#6600AA'; ctx.lineWidth = 2;

  // 腕
  ctx.fillStyle = '#2A0030';
  ctx.fillRect(cx - 30, cy + 22, 12, 36); ctx.fillRect(cx + 18, cy + 22, 12, 36);

  ctx.fillStyle = '#3A0040';
  for (let i = 0; i < 3; i++) {
    ctx.beginPath(); ctx.moveTo(cx - 30 + i * 4, cy + 58); ctx.lineTo(cx - 32 + i * 4, cy + 66); ctx.lineTo(cx - 26 + i * 4, cy + 58); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + 18 + i * 4, cy + 58); ctx.lineTo(cx + 16 + i * 4, cy + 66); ctx.lineTo(cx + 22 + i * 4, cy + 58); ctx.fill();
  }

  // 脚
  ctx.fillStyle = '#1A0020';
  ctx.fillRect(cx - 14, cy + 63, 11, 22); ctx.fillRect(cx + 3, cy + 63, 11, 22);

  // 首
  ctx.fillStyle = '#2A0030';
  ctx.fillRect(cx - 6, cy + 12, 12, 10);

  // 頭
  ctx.fillStyle = linGrad(cx, cy - 10, cx, cy + 18, [[0, '#3A0044'], [1, '#1E0028']]);
  ctx.beginPath(); ctx.ellipse(cx, cy + 4, 18, 16, 0, 0, Math.PI * 2); ctx.fill();

  // 角（左右）
  ctx.fillStyle = '#550066';
  ctx.beginPath(); ctx.moveTo(cx - 14, cy - 8); ctx.lineTo(cx - 20, cy - 30); ctx.lineTo(cx - 6, cy - 12); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx + 14, cy - 8); ctx.lineTo(cx + 20, cy - 30); ctx.lineTo(cx + 6, cy - 12); ctx.closePath(); ctx.fill();
  // 角の輝き
  ctx.strokeStyle = '#AA00FF'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx - 14, cy - 8); ctx.lineTo(cx - 20, cy - 30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 14, cy - 8); ctx.lineTo(cx + 20, cy - 30); ctx.stroke();

  // 目（赤く輝く）
  const eyeGlow = 0.7 + Math.sin(now * 0.005) * 0.3;
  ctx.fillStyle = `rgba(255,0,40,${eyeGlow})`;
  ctx.beginPath(); ctx.arc(cx - 7, cy + 2, 6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 7, cy + 2, 6, 0, Math.PI * 2); ctx.fill();
  // 外側グロー
  ctx.fillStyle = `rgba(255,0,80,${eyeGlow * 0.3})`;
  ctx.beginPath(); ctx.arc(cx - 7, cy + 2, 10, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 7, cy + 2, 10, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#FFF';
  ctx.beginPath(); ctx.arc(cx - 5, cy + 0.5, 2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 9, cy + 0.5, 2, 0, Math.PI * 2); ctx.fill();

  // 口（裂けた笑み）
  ctx.strokeStyle = '#FF0030'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy + 9, 8, 0.15, Math.PI - 0.15, false); ctx.stroke();
  // 牙
  ctx.fillStyle = '#FFFFEE';
  ctx.beginPath(); ctx.moveTo(cx - 5, cy + 10); ctx.lineTo(cx - 3, cy + 16); ctx.lineTo(cx - 1, cy + 10); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx + 1, cy + 10); ctx.lineTo(cx + 3, cy + 16); ctx.lineTo(cx + 5, cy + 10); ctx.fill();

  // 魔法陣（足元、回転）
  const rot = (now * 0.001) % (Math.PI * 2);
  ctx.save();
  ctx.translate(cx, cy + 74);
  ctx.rotate(rot);
  ctx.strokeStyle = `rgba(150,0,255,${0.25 + Math.sin(now * 0.003) * 0.1})`;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(0, 0, 38, 0, Math.PI * 2); ctx.stroke();
  for (let i = 0; i < 6; i++) {
    const a = i * Math.PI / 3;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 38, Math.sin(a) * 38); ctx.stroke();
  }
  ctx.restore();
}

// ===== 色操作ヘルパー（hex → 明るく/暗く） =====
function _lighten(hex, amt) {
  // hex='#RRGGBB' を amt(0〜1) 分明るくして返す
  const n = parseInt(hex.replace('#',''), 16);
  const r = Math.min(255, (n >> 16) + Math.round(255 * amt));
  const g = Math.min(255, ((n >> 8) & 0xff) + Math.round(255 * amt));
  const b = Math.min(255, (n & 0xff) + Math.round(255 * amt));
  return `rgb(${r},${g},${b})`;
}
function _darken(hex, amt) {
  const n = parseInt(hex.replace('#',''), 16);
  const r = Math.max(0, (n >> 16) - Math.round(255 * amt));
  const g = Math.max(0, ((n >> 8) & 0xff) - Math.round(255 * amt));
  const b = Math.max(0, (n & 0xff) - Math.round(255 * amt));
  return `rgb(${r},${g},${b})`;
}
// hex文字列のまま返すバリアント（createLinearGradient の addColorStop 用）
function _darkenHex(hex, amt) {
  const n = parseInt(hex.replace('#',''), 16);
  const r = Math.max(0, (n >> 16) - Math.round(255 * amt)).toString(16).padStart(2,'0');
  const g = Math.max(0, ((n >> 8) & 0xff) - Math.round(255 * amt)).toString(16).padStart(2,'0');
  const b = Math.max(0, (n & 0xff) - Math.round(255 * amt)).toString(16).padStart(2,'0');
  return `#${r}${g}${b}`;
}

// プレイヤーの現在位置に近い村・宿を返す
// 半径 2.8 タイル以内 → エンカウントブロック・Enter判定・プロンプト表示の全てに使用
const TOWN_SAFE_RADIUS = 2.8;

function getNearbyTown() {
  for (const t of mapTowns) {
    if (Math.hypot(field.px - t.tx, field.py - t.ty) < TOWN_SAFE_RADIUS) return t;
  }
  return null;
}

// 施設メニューの選択肢（村＝回復＋ショップ、宿屋＝回復のみ）
function getTownOptions(town) {
  if (town.type === 'village') {
    return [
      { label: 'みせ  (武器/防具/アイテム)',  action: 'shop'  },
      { label: 'やすむ  (HP/MP 少し回復)',    action: 'rest'  },
      { label: 'さる',                         action: 'leave' },
    ];
  } else {
    return [
      { label: 'とまる  (HP/MP 全回復)',      action: 'sleep' },
      { label: 'やすむ  (HP/MP 少し回復)',    action: 'rest'  },
      { label: 'さる',                         action: 'leave' },
    ];
  }
}

// ショップ状態は上部で定義済み

function getShopList() {
  const stock = SHOP_STOCK[shop.biome] || SHOP_STOCK[BIOME.PLAIN];
  if (shop.tab === 0) return stock.weapons.map(k=>({...WEAPON_MASTER[k], id:k, mtype:'weapon'}));
  if (shop.tab === 1) return stock.armors .map(k=>({...ARMOR_MASTER [k], id:k, mtype:'armor' }));
  return stock.items.map(k=>({...ITEM_MASTER[k], id:k, mtype:'item'}));
}

// フィールドメニュー状態（Mキーで開く）

function handleFieldMenuInput(key) {
  if (fieldMenu.messageTimer > 0) return;
  if (key === 'Escape' || key === 'x' || key === 'X' || key === 'm' || key === 'M') {
    fieldMenu.active = false; return;
  }
  if (key === 'ArrowLeft')  { fieldMenu.tab = (fieldMenu.tab + 1) % 2; fieldMenu.cursor = 0; return; }
  if (key === 'ArrowRight') { fieldMenu.tab = (fieldMenu.tab + 1) % 2; fieldMenu.cursor = 0; return; }

  if (fieldMenu.tab === 0) {
    // 装備タブ：武器・防具リスト
    const equipList = buildEquipList();
    if (key === 'ArrowUp')   fieldMenu.cursor = (fieldMenu.cursor - 1 + equipList.length) % equipList.length;
    if (key === 'ArrowDown') fieldMenu.cursor = (fieldMenu.cursor + 1) % equipList.length;
    if (key === 'Enter' || key === ' ') {
      const e = equipList[fieldMenu.cursor];
      if (!e) return;
      if (e.slot === 'weapon') { player.equip.weapon = player.equip.weapon===e.id ? null : e.id; fieldMenu.message = e.id ? e.name+'を そうび！' : '武器をはずした'; }
      else                     { player.equip.armor  = player.equip.armor ===e.id ? null : e.id; fieldMenu.message = e.id ? e.name+'を そうび！' : '防具をはずした'; }
      fieldMenu.messageTimer = 80;
    }
  } else {
    // アイテムタブ
    const inv = player.inventory;
    if (key === 'ArrowUp')   fieldMenu.cursor = (fieldMenu.cursor - 1 + Math.max(1,inv.length)) % Math.max(1,inv.length);
    if (key === 'ArrowDown') fieldMenu.cursor = (fieldMenu.cursor + 1) % Math.max(1,inv.length);
    if ((key === 'Enter' || key === ' ') && inv.length > 0) {
      const slot = inv[fieldMenu.cursor];
      if (!slot) return;
      const result = useItem(slot.itemId);
      fieldMenu.message = result || 'つかえなかった';
      fieldMenu.messageTimer = 90;
      fieldMenu.cursor = Math.min(fieldMenu.cursor, Math.max(0, player.inventory.length-1));
    }
  }
}

// 所持武器・防具リストを返す（装備可能なもの）
function buildEquipList() {
  const list = [];

  // インベントリに実際に存在するIDのセットを先に作る
  const ownedIds = new Set(player.inventory.map(s => s.itemId));

  // 武器：インベントリに存在するものだけ列挙
  for (const id of Object.keys(WEAPON_MASTER)) {
    if (!ownedIds.has(id)) continue;
    list.push({ ...WEAPON_MASTER[id], id, slot:'weapon', equipped: player.equip.weapon === id });
  }

  // 防具：インベントリに存在するものだけ列挙
  for (const id of Object.keys(ARMOR_MASTER)) {
    if (!ownedIds.has(id)) continue;
    list.push({ ...ARMOR_MASTER[id], id, slot:'armor', equipped: player.equip.armor === id });
  }

  // 装備スロットに入っているがインベントリに存在しない異常ケースを修正
  // （equip だけ残ってしまっている場合はスロットをクリアして整合性を保つ）
  if (player.equip.weapon && !ownedIds.has(player.equip.weapon)) {
    player.equip.weapon = null;
  }
  if (player.equip.armor && !ownedIds.has(player.equip.armor)) {
    player.equip.armor = null;
  }

  if (list.length === 0) list.push({ name:'（なし）', id:null, slot:'weapon', equipped:false, desc:'', atkBonus:0, defBonus:0 });
  return list;
}

function useTownOption(town, action) {
  if (action === 'shop') {
    shop.active=true; shop.tab=0; shop.cursor=0;
    shop.message=''; shop.messageTimer=0;
    shop.biome = town.biome;
    return;
  }
  if (action === 'rest') {
    const hpHeal = Math.floor(player.maxHp * 0.3);
    const mpHeal = Math.floor(player.maxMp * 0.3);
    player.hp = Math.min(player.maxHp, player.hp + hpHeal);
    player.mp = Math.min(player.maxMp, player.mp + mpHeal);
    townMenu.message = 'HP+'+hpHeal+' MP+'+mpHeal+' かいふくした！';
    townMenu.messageTimer = 120;
  } else if (action === 'sleep') {
    player.hp = player.maxHp;
    player.mp = player.maxMp;
    townMenu.message = 'HP・MPが　かんぜんかいふく！';
    townMenu.messageTimer = 120;
  } else if (action === 'leave') {
    townMenu.active = false;
    townMenu.town = null;
    townMenu.cursor = 0;
    townMenu.message = '';
  }
}

// 戦闘UI（メッセージ左＋コマンド右・2段階メニュー対応）
function drawBattleUI(msg, active) {
  const bottomY=H-118, msgW=W-180, cmdX=W-172;
  const cmdW=160;

  // ===== メッセージペイン（左） =====
  ctx.fillStyle='#000'; ctx.fillRect(8,bottomY,msgW-8,110);
  ctx.strokeStyle='#FFF'; ctx.lineWidth=2; ctx.strokeRect(8,bottomY,msgW-8,110);
  if (msg) {
    ctx.fillStyle='#FFF'; ctx.font='16px monospace';
    const chars=msg.split('');
    let line='',li=0;
    for (const ch of chars) {
      const test=line+ch;
      if (ctx.measureText(test).width>msgW-40&&line!=='') {
        ctx.fillText(line,20,bottomY+28+li*28); line=ch; li++;
        if(li>=3) break;
      } else line=test;
    }
    if(line&&li<3) ctx.fillText(line,20,bottomY+28+li*28);
  }

  // ===== コマンドペイン（右） =====
  ctx.fillStyle='#000'; ctx.fillRect(cmdX,bottomY,cmdW,110);
  ctx.strokeStyle='#FFF'; ctx.lineWidth=2; ctx.strokeRect(cmdX,bottomY,cmdW,110);

  if (!active) {
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(cmdX,bottomY,cmdW,110);
    return;
  }

  if (battle.menuLevel===0) {
    ctx.fillStyle='#AAAAAA'; ctx.font='13px monospace';
    ctx.fillText('なにをする？',cmdX+8,bottomY+16);

    const cats=[
      {label:'こうげき', color:'#FFFFFF'},
      {label:'じゅもん', color:'#AADDFF'},
    ];
    cats.forEach((cat,i)=>{
      const isSel=battle.categoryCursor===i;
      if (isSel) {
        ctx.fillStyle='#223366';
        ctx.fillRect(cmdX+4,bottomY+22+i*40,cmdW-8,32);
        ctx.strokeStyle='#6699FF'; ctx.lineWidth=1;
        ctx.strokeRect(cmdX+4,bottomY+22+i*40,cmdW-8,32);
      }
      ctx.fillStyle=isSel?'#FFD700':cat.color;
      ctx.font='17px monospace';
      ctx.fillText((isSel?'▶ ':'  ')+cat.label,cmdX+8,bottomY+43+i*40);
    });

  } else {
    const list=battle.categoryCursor===0?getLearnedAttackCmds():getLearnedMagicCmds();
    const catName=battle.categoryCursor===0?'こうげき':'じゅもん';
    ctx.fillStyle='#AAAAAA'; ctx.font='12px monospace';
    ctx.fillText('← '+catName+'  (Xで戻る)',cmdX+6,bottomY+14);

    const view=3;
    const start=Math.max(0,Math.min(battle.subCursor-1,list.length-view));
    for (let vi=0;vi<Math.min(view,list.length);vi++) {
      const idx=start+vi;
      if (idx>=list.length) break;
      const cmd=list[idx];
      const isSel=battle.subCursor===idx;
      const canUse=cmd.mpCost===0||player.mp>=cmd.mpCost;
      const rowY=bottomY+18+vi*28;

      if (isSel) {
        ctx.fillStyle='#223366';
        ctx.fillRect(cmdX+4,rowY,cmdW-8,24);
        ctx.strokeStyle='#6699FF'; ctx.lineWidth=1;
        ctx.strokeRect(cmdX+4,rowY,cmdW-8,24);
      }

      ctx.fillStyle=!canUse?'#555555':(isSel?'#FFD700':cmd.color);
      ctx.font='15px monospace';
      ctx.fillText((isSel?'▶':'  ')+cmd.key,cmdX+6,rowY+17);

      if (cmd.mpCost>0) {
        ctx.fillStyle=canUse?'#44AAFF':'#884444';
        ctx.font='11px monospace';
        ctx.fillText('MP'+cmd.mpCost,cmdX+cmdW-38,rowY+17);
      }
    }

    // スクロールインジケーター
    if (list.length>view) {
      ctx.fillStyle='#888'; ctx.font='16px monospace';
      if (start>0) ctx.fillText('▲',cmdX+cmdW-14,bottomY+22);
      if (start+view<list.length) ctx.fillText('▼',cmdX+cmdW-18,bottomY+98);
    }

    const selCmd=list[battle.subCursor];
    if (selCmd) {
      // たいあたりの場合は反動ダメージ予測値を追記
      let desc = selCmd.desc;
      let descColor = '#888888';
      if (selCmd.id === 'taiatari') {
        const recoil = Math.floor(player.maxHp * 0.08);
        desc += '  ⚠反動:' + recoil + 'HP';
        // 現在HPが反動ダメージ以下なら赤で警告
        if (player.hp <= recoil) {
          descColor = '#FF4444';
          desc = '⚠ HP僅か！反動で倒れます (' + recoil + 'HP)';
        }
      }
      ctx.fillStyle = descColor;
      ctx.font = '12px monospace';
      ctx.fillText(desc, cmdX+6, bottomY+104);
    }
  }
}

// y はバー上端のY座標。ラベルはバーの1px上、数値はバー内中央に描画する
function drawStatBar(x,y,label,cur,max,cH,cM,cL) {
  const barH = 13; // バーの高さ
  const barMidY = y + barH / 2; // バー縦中央

  // ラベル（バー左上にそろえる）
  ctx.textBaseline = 'bottom';
  ctx.fillStyle = '#FFF';
  ctx.font = '12px monospace';
  ctx.fillText(label, x, y - 1);

  // バー背景
  ctx.fillStyle = '#333';
  ctx.fillRect(x, y, 110, barH);

  // バー本体
  const r = Math.max(0, cur / max);
 
  ctx.fillStyle = r > 0.5 ? cH : r > 0.25 ? cM : cL;
  ctx.fillRect(x, y, 110 * r, barH);

  // バー枠
  ctx.strokeStyle = '#FFF';
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, 110, barH);

  // 数値（バー右隣・縦中央）
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#FFF';
  ctx.font = '12px monospace';
  ctx.fillText(cur + '/' + max, x + 114, barMidY);

  // textBaseline をデフォルトに戻す
  ctx.textBaseline = 'alphabetic';
}

}

  const wx=8, wy=H-118;
  ctx.fillStyle='#FFD700'; ctx.font='16px monospace'; ctx.fillText('▶ '+word,wx+10,wy+24);

  // ダークネス効果中：未入力文字のうちランダムな2文字を '*' で隠す
  // 隠す位置は typingStart を種にして固定（タイプ中に変化しないよう）
  let displayRoman = roman;
  if (battle.darknessDebuff) {
    const arr = roman.split('');
    // typingStartを種にした擬似乱数で隠す位置を決定（毎フレーム変わらない）
    const seed  = Math.floor(battle.typingStart) % 97;
    const len   = arr.length;
    const hide1 = typedCount + ((seed    ) % Math.max(1, len - typedCount));
    const hide2 = typedCount + ((seed + 3) % Math.max(1, len - typedCount));
    if (hide1 < len && hide1 >= typedCount) arr[hide1] = '*';
    if (hide2 < len && hide2 >= typedCount && hide2 !== hide1) arr[hide2] = '*';
    displayRoman = arr.join('');
  }

  ctx.font='24px monospace';
  const startX=wx+10; let curX=startX;
  for (let i=0;i<displayRoman.length;i++) {
    const isDark = battle.darknessDebuff && displayRoman[i] === '*';
    ctx.fillStyle = i<typedCount ? '#44FF44' : isDark ? '#FF4488' : '#CCCCCC';
    ctx.fillText(displayRoman[i],curX,wy+76);
    curX+=ctx.measureText(displayRoman[i]).width+1;
  }
  if (typedCount<roman.length) {
    const doneW=ctx.measureText(roman.substring(0,typedCount)).width+typedCount;
    if (Math.floor(Date.now()/300)%2===0) {
      ctx.fillStyle='#FFF'; ctx.fillRect(startX+doneW,wy+54,2,24);
    }
  }

  // ダークネス警告表示
  if (battle.darknessDebuff) {
    ctx.fillStyle='rgba(80,0,120,0.45)';
    ctx.fillRect(wx, wy+48, 200, 34);
    ctx.fillStyle='#FF88FF'; ctx.font='11px monospace';
    ctx.fillText('🌑 ダークネス: * は隠された文字', wx+4, wy+70);
  }
}

// 戦闘背景（バイオーム連動）
function drawBattleBackground() {
  const now  = Date.now();
  const biome = battle.biome;
  const isBoss = battle.isBossBattle;
  const clipH = H * 0.58; // 背景描画の下端

  // ===== バイオームごとの空色と大地色を定義 =====
  // sky: [上端, 下端],  ground: [上端, 下端]
  const themes = {
    [BIOME.PLAIN]:   { sky:['#5BB8F5','#A8D8EA'], ground:['#5AB86C','#2E6B35'], skyExtra:'sun'  },
    [BIOME.FOREST]:  { sky:['#1E3A1E','#2E5A28'], ground:['#1E4A20','#0E2A10'], skyExtra:'rays' },
    [BIOME.DESERT]:  { sky:['#FF8C00','#FFD060'], ground:['#D4A84B','#9A7030'], skyExtra:'sun'  },
    [BIOME.SNOW]:    { sky:['#B0BEC5','#E0EAF0'], ground:['#DDE8F0','#A8C0D0'], skyExtra:'snow' },
    [BIOME.VOLCANO]: { sky:['#1A0A00','#3A1000'], ground:['#5A1000','#2A0800'], skyExtra:'lava' },
    [BIOME.SWAMP]:   { sky:['#1E1A2E','#2E2240'], ground:['#1E2A18','#0E1A08'], skyExtra:'fog'  },
    [BIOME.COAST]:   { sky:['#1E90FF','#6EC6FF'], ground:['#D4B96A','#4090C0'], skyExtra:'sea'  },
  };
  const theme = isBoss
    ? { sky:['#08000E','#180028'], ground:['#200030','#0A0018'], skyExtra:'boss' }
    : (themes[biome] || themes[BIOME.PLAIN]);

  // ── 空グラデーション ──
  const sg = ctx.createLinearGradient(0, 0, 0, clipH * 0.6);
  sg.addColorStop(0, theme.sky[0]);
  sg.addColorStop(1, theme.sky[1]);
  ctx.fillStyle = sg;
  ctx.fillRect(0, 0, W, clipH * 0.6);

  // ── 空の追加演出 ──
  switch (theme.skyExtra) {
    case 'sun': {
      // 太陽（砂漠はオレンジ大、平原は白黄小）
      const sunCol = biome === BIOME.DESERT ? '#FFD020' : '#FFFFA0';
      const sunR   = biome === BIOME.DESERT ? 38 : 24;
      const sunX   = W * 0.82, sunY = H * 0.1;
      // グロー
      ctx.fillStyle = biome === BIOME.DESERT ? 'rgba(255,160,0,0.18)' : 'rgba(255,255,180,0.15)';
      ctx.beginPath(); ctx.arc(sunX, sunY, sunR * 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = sunCol;
      ctx.beginPath(); ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2); ctx.fill();
      // 太陽光線（砂漠のみ）
      if (biome === BIOME.DESERT) {
        ctx.strokeStyle = 'rgba(255,220,50,0.25)'; ctx.lineWidth = 2;
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2 + now * 0.0003;
          ctx.beginPath();
          ctx.moveTo(sunX + Math.cos(a) * (sunR + 4), sunY + Math.sin(a) * (sunR + 4));
          ctx.lineTo(sunX + Math.cos(a) * (sunR + 18), sunY + Math.sin(a) * (sunR + 18));
          ctx.stroke();
        }
      }
      break;
    }
    case 'rays': {
      // 木漏れ日（斜め光の束）
      ctx.fillStyle = 'rgba(150,230,100,0.06)';
      for (let i = 0; i < 5; i++) {
        const rx = W * 0.1 + i * W * 0.18 + Math.sin(now * 0.0005 + i) * 10;
        ctx.beginPath();
        ctx.moveTo(rx, 0); ctx.lineTo(rx + 30, clipH * 0.6);
        ctx.lineTo(rx + 60, clipH * 0.6); ctx.lineTo(rx + 30, 0);
        ctx.closePath(); ctx.fill();
      }
      break;
    }
    case 'snow': {
      // 雪粒（ゆっくり降る）
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      for (let i = 0; i < 30; i++) {
        const sx = ((i * 73 + now * 0.02) % W);
        const sy = ((i * 47 + now * 0.015) % (clipH * 0.6));
        ctx.beginPath(); ctx.arc(sx, sy, 1.5, 0, Math.PI * 2); ctx.fill();
      }
      // 雪雲
      ctx.fillStyle = 'rgba(200,210,220,0.35)';
      for (let i = 0; i < 3; i++) {
        ctx.beginPath(); ctx.ellipse(W * 0.2 + i * W * 0.3, H * 0.08, 60 + i * 20, 20, 0, 0, Math.PI * 2); ctx.fill();
      }
      break;
    }
    case 'lava': {
      // 黒煙（上昇する煙粒子）
      for (let i = 0; i < 15; i++) {
        const phase = (now * 0.0008 + i * 0.42) % 1;
        const sx  = W * 0.05 + (i * 43) % (W * 0.9);
        const sy  = clipH * 0.6 * (1 - phase);
        const sa  = 0.15 * (1 - phase);
        ctx.fillStyle = `rgba(20,10,0,${sa})`;
        ctx.beginPath(); ctx.arc(sx, sy, 8 + phase * 20, 0, Math.PI * 2); ctx.fill();
      }
      // 空中の赤オーラ（揺らぎ）
      const laA = 0.08 + Math.sin(now * 0.002) * 0.03;
      ctx.fillStyle = `rgba(200,40,0,${laA})`;
      ctx.fillRect(0, 0, W, clipH * 0.6);
      break;
    }
    case 'fog': {
      // 霧（水平方向に流れる）
      for (let i = 0; i < 4; i++) {
        const fx = ((now * 0.02 * (i % 2 === 0 ? 1 : -1) + i * 150) % (W + 100)) - 50;
        ctx.fillStyle = `rgba(80,40,120,${0.08 + i * 0.03})`;
        ctx.beginPath(); ctx.ellipse(fx + W * 0.3, clipH * 0.35 + i * 20, 120, 30, 0, 0, Math.PI * 2); ctx.fill();
      }
      break;
    }
    case 'sea': {
      // 水平線と波
      ctx.fillStyle = '#2060AA';
      ctx.fillRect(0, clipH * 0.42, W, clipH * 0.18);
      // 光の反射
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      for (let i = 0; i < 6; i++) {
        const wx = (now * 0.04 + i * 110) % W;
        ctx.fillRect(wx, clipH * 0.44, 40, 2);
      }
      break;
    }
    case 'boss': {
      // 禍々しい闇オーラ（ボス専用）
      const ba = 0.12 + Math.sin(now * 0.003) * 0.06;
      const bg2 = ctx.createRadialGradient(W / 2, H * 0.25, 20, W / 2, H * 0.25, 200);
      bg2.addColorStop(0, `rgba(120,0,80,${ba})`);
      bg2.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = bg2; ctx.fillRect(0, 0, W, clipH * 0.6);
      // 赤い稲妻（確率で閃光）
      if (Math.floor(now / 600) % 7 === 0) {
        ctx.strokeStyle = 'rgba(255,60,120,0.5)'; ctx.lineWidth = 1.5;
        let lx = W * 0.3 + Math.random() * W * 0.4, ly = 0;
        ctx.beginPath(); ctx.moveTo(lx, ly);
        for (let i = 0; i < 5; i++) {
          lx += (Math.random() - 0.5) * 30; ly += clipH * 0.1;
          ctx.lineTo(lx, ly);
        }
        ctx.stroke();
      }
      // 星（禍々しい色の星）
      ctx.fillStyle = 'rgba(200,100,255,0.5)';
      for (let i = 0; i < 20; i++) {
        const sx = (i * 73) % W;
        const sy = (i * 47) % (clipH * 0.5);
        const sa = 0.3 + Math.sin(now * 0.004 + i) * 0.3;
        ctx.globalAlpha = sa;
        ctx.beginPath(); ctx.arc(sx, sy, 1, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      break;
    }
  }

  // ── 地形シルエット（山稜線）──
  const silCol = isBoss ? '#0A0012' : _darkenHex(theme.ground[0], 0.35);
  ctx.fillStyle = silCol;
  ctx.beginPath();
  ctx.moveTo(0, clipH * 0.6);
  // バイオームごとに山の形状を変える
  const peaks = {
    [BIOME.PLAIN]:   [[0,0.46],[0.09,0.38],[0.19,0.50],[0.30,0.34],[0.41,0.46],[0.53,0.30],[0.63,0.43],[0.75,0.36],[1,0.60]],
    [BIOME.FOREST]:  [[0,0.40],[0.07,0.28],[0.15,0.40],[0.25,0.24],[0.38,0.38],[0.50,0.20],[0.62,0.34],[0.78,0.22],[1,0.50]],
    [BIOME.DESERT]:  [[0,0.52],[0.15,0.48],[0.28,0.52],[0.42,0.46],[0.58,0.52],[0.72,0.47],[0.86,0.53],[1,0.55]],
    [BIOME.SNOW]:    [[0,0.44],[0.08,0.28],[0.18,0.44],[0.28,0.24],[0.40,0.38],[0.54,0.22],[0.66,0.38],[0.80,0.26],[1,0.50]],
    [BIOME.VOLCANO]: [[0,0.40],[0.10,0.50],[0.22,0.28],[0.30,0.50],[0.44,0.22],[0.54,0.44],[0.66,0.26],[0.80,0.48],[1,0.50]],
    [BIOME.SWAMP]:   [[0,0.50],[0.12,0.46],[0.24,0.52],[0.38,0.44],[0.52,0.50],[0.66,0.46],[0.80,0.52],[1,0.55]],
    [BIOME.COAST]:   [[0,0.52],[0.20,0.48],[0.40,0.52],[0.60,0.48],[0.80,0.52],[1,0.55]],
  };
  const pts = isBoss
    ? [[0,0.42],[0.08,0.36],[0.18,0.48],[0.28,0.32],[0.40,0.46],[0.52,0.28],[0.64,0.44],[0.80,0.30],[1,0.50]]
    : (peaks[biome] || peaks[BIOME.PLAIN]);
  for (const [px2, py2] of pts) ctx.lineTo(W * px2, clipH * py2);
  ctx.lineTo(W, clipH * 0.6); ctx.closePath(); ctx.fill();

  // ── 大地グラデーション ──
  const gg = ctx.createLinearGradient(0, clipH * 0.55, 0, clipH);
  gg.addColorStop(0, theme.ground[0]);
  gg.addColorStop(1, theme.ground[1]);
  ctx.fillStyle = gg;
  ctx.fillRect(0, clipH * 0.55, W, clipH * 0.45);

  // ── 火山バイオーム追加：溶岩池（地面に赤い筋）──
  if (biome === BIOME.VOLCANO && !isBoss) {
    ctx.fillStyle = 'rgba(255,80,0,0.22)';
    for (let i = 0; i < 3; i++) {
      const lx2 = W * 0.1 + i * W * 0.3 + Math.sin(now * 0.001 + i) * 8;
      ctx.beginPath(); ctx.ellipse(lx2, clipH * 0.62 + i * 4, 40 + i * 15, 6, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  // ── 海岸バイオーム追加：砂浜ライン ──
  if (biome === BIOME.COAST) {
    ctx.fillStyle = '#D4B96A';
    ctx.fillRect(0, clipH * 0.55, W, 12);
  }
}

function drawBattlePlayer() {
  const now = Date.now();
  // ===== キャラクタースケール（1.5倍・サイズアップ） =====
  const SCALE = 1.5;

  // ===== 待機アニメーション =====
  // 呼吸：1.8秒周期で上下±4px、横±1%伸縮（1.5倍スケールに合わせ増幅）
  const breath = Math.sin(now * 0.0035);
  const bobY   = breath * 4;
  const scaleX = 1 + breath * 0.018;
  const scaleY = 1 - breath * 0.018;

  // ===== シェイク（1.5倍スケールに合わせて振れ幅も増幅） =====
  const shakeX = calcShake(battle.playerShake, 9);
  if (battle.playerShake > 0) battle.playerShake--;

  // ベース座標（スケールアップ分だけ少し左＆上に移動）
  const cx = W / 4 + shakeX;
  const cy = H * 0.55 - 32 * SCALE + bobY;

  ctx.save();
  // 足元を基準にスケール（呼吸アニメ）
  ctx.translate(cx, cy + 40 * SCALE);
  ctx.scale(scaleX * SCALE, scaleY * SCALE);
  ctx.translate(-cx, -(cy + 40 * SCALE));

  // ===== プレイヤー本体描画 =====
  // 影
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + 40, 12, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // 足（茶色ブーツ）
  ctx.fillStyle = '#5C2A00';
  ctx.fillRect(cx - 9, cy + 30, 7, 12);
  ctx.fillRect(cx + 2,  cy + 30, 7, 12);
  // ブーツの先
  ctx.fillStyle = '#3A1800';
  ctx.fillRect(cx - 10, cy + 38, 9, 4);
  ctx.fillRect(cx + 1,  cy + 38, 9, 4);

  // 胴体（青い鎧）
  const armorGrad = ctx.createLinearGradient(cx - 10, cy + 14, cx + 10, cy + 14);
  armorGrad.addColorStop(0,   '#1A55BB');
  armorGrad.addColorStop(0.5, '#2E74DD');
  armorGrad.addColorStop(1,   '#1A55BB');
  ctx.fillStyle = armorGrad;
  ctx.fillRect(cx - 9, cy + 14, 18, 16);

  // 肩アーマー（赤・立体感）
  ctx.fillStyle = '#DD3300';
  ctx.beginPath();
  ctx.ellipse(cx - 11, cy + 17, 6, 4, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + 11, cy + 17, 6, 4, 0.3, 0, Math.PI * 2);
  ctx.fill();
  // 肩ハイライト
  ctx.fillStyle = '#FF5522';
  ctx.beginPath();
  ctx.ellipse(cx - 11, cy + 16, 4, 2.5, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + 11, cy + 16, 4, 2.5, 0.3, 0, Math.PI * 2);
  ctx.fill();

  // 腕（袖・青）
  ctx.fillStyle = '#2266CC';
  ctx.fillRect(cx - 15, cy + 15, 6, 12);
  ctx.fillRect(cx + 9,  cy + 15, 6, 12);
  // 手（肌色）
  ctx.fillStyle = '#F4C07A';
  ctx.fillRect(cx - 14, cy + 26, 5, 5);
  ctx.fillRect(cx + 9,  cy + 26, 5, 5);

  // 鎧の中央ライン
  ctx.fillStyle = '#FFD700';
  ctx.fillRect(cx - 1, cy + 14, 2, 16);

  // 首
  ctx.fillStyle = '#F4C07A';
  ctx.fillRect(cx - 3, cy + 9, 6, 6);

  // 頭（顔）
  const faceGrad = ctx.createRadialGradient(cx - 2, cy - 2, 1, cx, cy + 2, 9);
  faceGrad.addColorStop(0,   '#FFD49A');
  faceGrad.addColorStop(1,   '#E8A860');
  ctx.fillStyle = faceGrad;
  ctx.beginPath();
  ctx.ellipse(cx, cy + 3, 9, 10, 0, 0, Math.PI * 2);
  ctx.fill();

  // 目
  ctx.fillStyle = '#1A1A1A';
  ctx.beginPath(); ctx.arc(cx - 3, cy + 2, 2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 3, cy + 2, 2, 0, Math.PI * 2); ctx.fill();
  // 目のハイライト
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath(); ctx.arc(cx - 2.5, cy + 1.5, 0.8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 3.5, cy + 1.5, 0.8, 0, Math.PI * 2); ctx.fill();

  // 眉（凛々しい）
  ctx.fillStyle = '#5C3010';
  ctx.fillRect(cx - 5, cy - 2, 4, 1.5);
  ctx.fillRect(cx + 1, cy - 2, 4, 1.5);

  // 鼻
  ctx.fillStyle = '#C8905A';
  ctx.fillRect(cx - 1, cy + 5, 2, 2);

  // 口（軽い微笑み）
  ctx.strokeStyle = '#8B4010';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(cx, cy + 7, 3, 0.2, Math.PI - 0.2, false);
  ctx.stroke();

  // 髪（茶色・前髪）
  ctx.fillStyle = '#3A2010';
  ctx.beginPath();
  ctx.ellipse(cx, cy - 6, 10, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  // 前髪の垂れ（ひと房）
  ctx.beginPath();
  ctx.moveTo(cx - 8, cy - 2);
  ctx.quadraticCurveTo(cx - 10, cy + 2, cx - 7, cy + 4);
  ctx.lineWidth = 3; ctx.strokeStyle = '#3A2010';
  ctx.stroke();

  // ===== 被弾フラッシュ（赤半透明） =====
  if (battle.playerHitFlash > 0) {
    battle.playerHitFlash--;
    ctx.fillStyle = `rgba(255,60,0,${battle.playerHitFlash / 8 * 0.5})`;
    ctx.fillRect(cx - 16, cy - 8, 32, 50);
  }

  ctx.restore();
}

// ===== ゲームクリア画面 =====
function drawGameClear(timer) {
  // フェードイン（最初の120フレーム）
  const alpha = Math.min(1, timer / 120);

  // 背景（漆黒→深紫グラデーション）
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#000000');
  bg.addColorStop(1, '#1A0030');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 星（ゆっくり輝く）
  ctx.fillStyle = '#FFFFFF';
  const stars = [
    30,20, 80,50, 140,15, 200,40, 280,10, 340,35, 410,18,
    470,45, 520,22, 580,38, 610,12, 60,70, 180,65, 360,72,
    500,60, 550,80, 90,90, 250,85, 430,90,
  ];
  for (let i = 0; i < stars.length; i += 2) {
    ctx.globalAlpha = alpha * (0.4 + Math.sin(timer * 0.03 + i) * 0.3);
    ctx.fillRect(stars[i], stars[i+1], 1.5, 1.5);
  }
  ctx.globalAlpha = alpha;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // ===== タイトル「THE END」=====
  if (timer > 60) {
    const t2 = Math.min(1, (timer - 60) / 90);
    ctx.globalAlpha = alpha * t2;
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 48px monospace';
    // 影
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillText('THE END', W/2+3, H*0.22+3);
    const g = ctx.createLinearGradient(0, H*0.12, 0, H*0.32);
    g.addColorStop(0, '#FFE866');
    g.addColorStop(0.5, '#FFD700');
    g.addColorStop(1, '#CC9900');
    ctx.fillStyle = g;
    ctx.fillText('THE END', W/2, H*0.22);
  }

  // ===== サブタイトル =====
  if (timer > 120) {
    const t3 = Math.min(1, (timer - 120) / 60);
    ctx.globalAlpha = alpha * t3;
    ctx.fillStyle = '#AACCFF';
    ctx.font = '15px monospace';
    ctx.fillText('タイピング魔王を打ち倒し 世界に平和が訪れた', W/2, H*0.32);
  }

  // ===== スタッフロール =====
  const credits = [
    { label: '--- GAME CLEAR ---',        color: '#FFD700', bold: true,  t: 180 },
    { label: 'GAME DESIGN & PROGRAMMING', color: '#88CCFF', bold: false, t: 230 },
    { label: 'You',                        color: '#FFFFFF', bold: true,  t: 270 },
    { label: '',                           color: '',        bold: false, t: 310 },
    { label: 'POWERED BY',                 color: '#88CCFF', bold: false, t: 330 },
    { label: 'Web Audio API  Canvas 2D',   color: '#CCCCCC', bold: false, t: 370 },
    { label: '',                           color: '',        bold: false, t: 400 },
    { label: 'SPECIAL THANKS',             color: '#88CCFF', bold: false, t: 420 },
    { label: 'All Typists',                color: '#FFFFFF', bold: true,  t: 460 },
  ];
  for (const c of credits) {
    if (timer < c.t || !c.label) continue;
    const ct = Math.min(1, (timer - c.t) / 40);
    ctx.globalAlpha = alpha * ct;
    ctx.fillStyle = c.color;
    ctx.font = (c.bold ? 'bold ' : '') + '16px monospace';
    // スクロールY（遅いスクロール）
    const scrollY = Math.max(0, (timer - 300) * 0.3);
    const baseY   = H * 0.44 + credits.indexOf(c) * 28 - scrollY;
    if (baseY > 10 && baseY < H - 10) ctx.fillText(c.label, W/2, baseY);
  }

  // ===== 「Enter/Spaceでタイトルへ」（450フレーム以降、点滅） =====
  if (timer > 450) {
    const blinkOn = Math.floor(timer / 35) % 2 === 0;
    ctx.globalAlpha = alpha * (blinkOn ? 0.9 : 0.3);
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '14px monospace';
    ctx.fillText('Enter / Space  でタイトルへ戻る', W/2, H - 24);
  }

  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

function drawResultScreen(win) {
  ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  if (win) {
    ctx.fillStyle='#FFD700'; ctx.font='bold 34px monospace'; ctx.fillText('しょうり！',W/2,H/2-80);
    ctx.fillStyle='#FFFFFF'; ctx.font='17px monospace';
    ctx.fillText(enemy.name+' (Lv'+enemy.lv+') をたおした！',W/2,H/2-52);
    ctx.fillStyle='#AAFFAA'; ctx.font='16px monospace';
    ctx.fillText('+ '+lastExpGain+' EXP    + '+lastCoinGain+' コイン', W/2, H/2-26);
    const expNeeded=expToNext(player.lv);
    const bw=260, bx=W/2-130;
    ctx.fillStyle='#333'; ctx.fillRect(bx,H/2-8,bw,12);
    ctx.fillStyle='#44CCFF'; ctx.fillRect(bx,H/2-8,bw*Math.min(1,player.exp/expNeeded),12);
    ctx.strokeStyle='#88EEFF'; ctx.lineWidth=1; ctx.strokeRect(bx,H/2-8,bw,12);
    ctx.fillStyle='#AAEEFF'; ctx.font='17px monospace';
    ctx.fillText('EXP '+player.exp+'/'+expNeeded+'  (Lv'+player.lv+')',W/2,H/2+18);
    if (lastLevelUp>0) {
      ctx.fillStyle='#FFD700'; ctx.font='bold 22px monospace';
      ctx.fillText('★ LEVEL UP! → Lv'+player.lv+' ★',W/2,H/2+44);
      ctx.fillStyle='#CCFFCC'; ctx.font='16px monospace';
      ctx.fillText('HP+'+lastStatGain.hp+'  MP+'+lastStatGain.mp+'  ATK+'+lastStatGain.atk+'  DEF+'+lastStatGain.def,W/2,H/2+62);

      // 技習得メッセージ（lastLearnedSkills に id が入っている場合）
      if (lastLearnedSkills.length > 0) {
        // id → 表示名を ATTACK_CMDS / MAGIC_CMDS から引く
        const allCmds = [...ATTACK_CMDS, ...MAGIC_CMDS];
        lastLearnedSkills.forEach((id, i) => {
          const cmd = allCmds.find(c => c.id === id);
          const label = cmd ? cmd.key : id;
          ctx.fillStyle = '#FFD700';
          ctx.font = 'bold 17px monospace';
          ctx.fillText('✨ ' + label + ' を おぼえた！', W/2, H/2 + 86 + i * 24);
        });
      }
    }
    ctx.fillStyle='#AAAAAA'; ctx.font='17px monospace';
    // 技習得がある場合は下にずらして重ならないようにする
    const enterY = lastLevelUp > 0 && lastLearnedSkills.length > 0
      ? H/2 + 90 + lastLearnedSkills.length * 24
      : H-40;
    ctx.fillText('Enterキーでフィールドへ', W/2, Math.max(H-40, enterY));
  } else {
    ctx.fillStyle='#FF4444'; ctx.font='bold 38px monospace'; ctx.fillText('ゲームオーバー',W/2,H/2-30);
    ctx.fillStyle='#FFFFFF'; ctx.font='16px monospace'; ctx.fillText('到達レベル: '+player.lv,W/2,H/2+10);
    // セーブデータの有無でメッセージを切り替え
    if (hasSaveData()) {
      ctx.fillStyle='#AAFFAA'; ctx.font='17px monospace';
      ctx.fillText('Enterキーでセーブ地点から再開',W/2,H/2+40);
      ctx.fillStyle='#888888'; ctx.font='13px monospace';
      ctx.fillText('（セーブデータがない場合はタイトルへ）',W/2,H/2+62);
    } else {
      ctx.fillStyle='#AAAAAA'; ctx.font='17px monospace';
      ctx.fillText('Enterキーでタイトルへ戻る',W/2,H/2+40);
    }
  }
  ctx.textAlign='left';
}

// フィールド描画
function renderField() {
  // トップダウン：プレイヤーをピクセル座標に変換してカメラ中心に
  field.camX = field.px * TW - W / 2 + TW / 2;
  field.camY = field.py * TH - (H - 120) / 2 + TH / 2;
  drawIsoField(field.camX,field.camY,field.walkFrame,field.facing);

  const biome=getCurrentBiome();
  const biomeInfo=BIOME_INFO[biome]||BIOME_INFO[0];
  const expNeeded=expToNext(player.lv);

  if (shop.active) {
    drawShopUI();
  } else if (fieldMenu.active) {
    drawFieldMenuUI();
  } else if (townMenu.active) {
    // 施設メニュー表示中
    drawTownMenu(townMenu.town);
  } else {
    // 通常フィールドUI
    drawMessageWindow([
      'Lv'+player.lv+'  HP '+player.hp+'/'+player.maxHp+'  MP '+player.mp+'/'+player.maxMp,
      '['+biomeInfo.name+']  EXP '+player.exp+'/'+expNeeded+'  G:'+player.coins,
    ]);
    // EXPバー
    const bx=20,by=H-25,bw=W-40,bh=8;
    ctx.fillStyle='#222'; ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle='#44AAFF'; ctx.fillRect(bx,by,bw*Math.min(1,player.exp/expNeeded),bh);
    ctx.strokeStyle='#446688'; ctx.lineWidth=1; ctx.strokeRect(bx,by,bw,bh);

    // 近くに施設があればプロンプト表示
    const nearTown = getNearbyTown();
    if (nearTown) drawTownPrompt(nearTown);

    // 安全圏内に入っているとき「[安全圏]」ラベルをUIに表示
    if (nearTown) {
      ctx.fillStyle = '#88FFAA';
      ctx.font = 'bold 12px monospace';
      ctx.textBaseline = 'bottom';
      ctx.textAlign = 'right';
      ctx.fillText('[安全圏]', W - 180, H - 10); // EXPバー右端の内側
      ctx.textBaseline = 'alphabetic';
      ctx.textAlign = 'left';
    }

    // ボスに接近中はプロンプト表示（撃破済みは非表示）
    if (BOSS_EVENT.isNear && !BOSS_EVENT.isDefeated) {
      drawMessageWindow([
        'まがまがしい妖気を感じる…！',
        '[Enter で決戦]',
      ]);
    }
  }

  // ミニマップ（右上・常時表示）
  // フレーム幅 = 160 + 4*2 = 168px、右端から 4px 余白
  drawMinimap(W - 172, 8);

  // セーブ通知（画面中央上部にフェードイン/アウト表示）
  if (saveNotify.timer > 0) {
    saveNotify.timer--;
    // フェードイン（最初の15フレーム）とフェードアウト（最後の30フレーム）
    const fade = Math.min(1,
      saveNotify.timer < 30
        ? saveNotify.timer / 30          // フェードアウト
        : (SAVE_NOTIFY_DURATION - saveNotify.timer) < 15
          ? (SAVE_NOTIFY_DURATION - (SAVE_NOTIFY_DURATION - saveNotify.timer)) / 15  // フェードイン
          : 1
    );
    const notifyW = 220, notifyH = 32;
    const notifyX = (W - notifyW) / 2;
    const notifyY = 54;

    ctx.globalAlpha = fade * 0.82;
    ctx.fillStyle = '#111';
    ctx.fillRect(notifyX, notifyY, notifyW, notifyH);
    ctx.strokeStyle = '#88CCFF';
    ctx.lineWidth = 1;
    ctx.strokeRect(notifyX + 0.5, notifyY + 0.5, notifyW - 1, notifyH - 1);

    ctx.globalAlpha = fade;
    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 15px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(saveNotify.msg, W / 2, notifyY + notifyH / 2);

    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }
}

// 戦闘描画
function renderBattle() {
  drawBattleBackground();
  drawBattlePlayer();
  drawEnemy(enemy);
  // HP/MPバー：ラベル(12px) + バー(13px) = 25px/行、行間4px で配置
  // y はバー上端。ラベルはバーの1px上に描かれるため画面上端から余白8px確保
  drawHPBar(8, 20, 'ゆうしゃ Lv'+player.lv, player.hp, player.maxHp);
  drawMPBar(8, 50, 'MP', player.mp, player.maxMp);
  // 敵の状態異常アイコン（残りターン数付き、早期解除の可能性も表示）
  const enemyStatusIcon =
      enemy.status === 'poison'    ? ' 🟣' + enemy.statusTurns
    : enemy.status === 'paralysis' ? ' ⚡'  + enemy.statusTurns
    : enemy.status === 'burn'      ? ' 🔥' + enemy.statusTurns
    : enemy.status === 'freeze'    ? ' 🧊' + enemy.statusTurns
    : enemy.status === 'shock'     ? ' ⚡' + enemy.statusTurns
    : '';
  drawHPBar(W-260, 20, enemy.name+' Lv'+enemy.lv+enemyStatusIcon, enemy.hp, enemy.maxHp);
  // ATK/DEFはMPバー(y=50〜63)の下に8px空けて配置
  ctx.fillStyle='#AAAAAA'; ctx.font='13px monospace';
  ctx.textBaseline='top';
  ctx.fillText('ATK:'+player.atk+' DEF:'+player.def, 8, 71);
  ctx.textBaseline='alphabetic';
  // バイキルト発動中の表示
  if (battle.atkBuff>0) {
    ctx.fillStyle='#FFFF44'; ctx.font='bold 12px monospace';
    ctx.textBaseline='top';
    ctx.fillText('⚡オーラ発動中！', 8, 86);
    ctx.textBaseline='alphabetic';
  }

  if (battle.phase==='command') {
    const msg=battle.messageTimer>0?battle.message:'なにをする？';
    drawBattleUI(msg, battle.messageTimer<=0);
  } else if (battle.phase==='typing') {
    drawBattleUI(null, false);
    const elapsed=performance.now()-battle.typingStart;
    drawTypingGauge(elapsed,battle.typingLimit);
    drawTypingTextInBattle(battle.typingWord,battle.typingTarget,battle.typingIndex);
  } else if (battle.phase==='result_player'||battle.phase==='result_enemy') {
    drawBattleUI(battle.message, false);
  }

  // エフェクト描画（常に最前面）
  drawEffects();
}
// ===== ゲームループ =====
let lastTime=0, walkAnimTimer=0;

function gameLoop(ts) {
  const dt=ts-lastTime; lastTime=ts;
  ctx.clearRect(0,0,W,H);

  // ===== タイトル画面 =====
  if (mode==='title') {
    bgmSyncToMode('title');
    title.animTimer++;
    drawTitle(title.animTimer);
    requestAnimationFrame(gameLoop);
    return;
  }

  // ===== あそびかた画面 =====
  if (mode==='howtoplay') {
    title.animTimer++;
    drawHowToPlay(title.animTimer);
    requestAnimationFrame(gameLoop);
    return;
  }

  if (mode==='field') {
    // ショップ・フィールドメニュー・施設メニューが開いているときは移動停止して描画だけ
    if (shop.active || fieldMenu.active || townMenu.active) {
      if (townMenu.active && townMenu.messageTimer > 0) {
        townMenu.messageTimer--;
        if (townMenu.messageTimer === 0) townMenu.message = '';
      }
      if (shop.messageTimer > 0) shop.messageTimer--;
      if (fieldMenu.messageTimer > 0) fieldMenu.messageTimer--;
      renderField();
      requestAnimationFrame(gameLoop);
      return;
    }

    const speed=0.06; let dx=0,dy=0;
    if (keys['ArrowUp']   ||keys['w']) { dy-=speed; }
    if (keys['ArrowDown'] ||keys['s']) { dy+=speed; }
    if (keys['ArrowLeft'] ||keys['a']) { dx-=speed; }
    if (keys['ArrowRight']||keys['d']) { dx+=speed; }
    if (dx!==0&&dy!==0) { dx*=0.707; dy*=0.707; }
    const moved=dx!==0||dy!==0;

    if (moved) {
      if      (dy<0&&Math.abs(dy)>=Math.abs(dx)) field.facing='up';
      else if (dy>0&&Math.abs(dy)>=Math.abs(dx)) field.facing='down';
      else if (dx<0) field.facing='left';
      else           field.facing='right';
      const nx=Math.max(0.5,Math.min(MAP_W-1.5,field.px+dx));
      const ny=Math.max(0.5,Math.min(MAP_H-1.5,field.py+dy));
      const tx=Math.round(nx), ty=Math.round(ny);
      const tid=(tx>=0&&ty>=0&&tx<MAP_W&&ty<MAP_H)?mapTiles[ty][tx]:0;
      if (tid!==70&&tid!==71) {
        // 木・岩との衝突
        let blocked=false;
        for (const obj of mapObjects) {
          if (Math.hypot(nx-obj.tx,ny-obj.ty)<0.7) { blocked=true; break; }
        }
        if (!blocked) { field.px=nx; field.py=ny; }
      }

      field.moving=true;
      walkAnimTimer+=dt;
      if (walkAnimTimer>180) {
        walkAnimTimer=0;
        field.walkFrame=1-field.walkFrame;
        field.stepCount++;
        // バイオームごとのエンカウント率補正
        const biome=getCurrentBiome();
        const encMod=BIOME_INFO[biome]?.encRate||1.0;
        const threshold=Math.floor(field.encountSteps/encMod);
        if (field.stepCount>=threshold) {
          field.stepCount=0;
          field.encountSteps=15+Math.floor(Math.random()*15);
          // 施設の近くではエンカウントしない
          // ボス近くでも雑魚エンカウントしない
          if (!getNearbyTown() && !BOSS_EVENT.isNear) startFlash();
        }
      }
    } else {
      field.moving=false; field.walkFrame=0; walkAnimTimer=0;
    }

    // ===== ボス接近判定 =====
    if (!BOSS_EVENT.isDefeated) {
      const bossDist = Math.hypot(field.px - BOSS_EVENT.tx, field.py - BOSS_EVENT.ty);
      BOSS_EVENT.isNear = bossDist < BOSS_EVENT.triggerRadius;
    } else {
      BOSS_EVENT.isNear = false;
    }

    renderField();

    // ===== リトライフェードイン演出 =====
    if (retryFade.active) {
      retryFade.timer++;
      // 暗転（alpha: 1→0）でじわっとフィールドを浮き上がらせる
      const alpha = Math.max(0, 1 - retryFade.timer / retryFade.duration);
      ctx.fillStyle = `rgba(0,0,0,${alpha})`;
      ctx.fillRect(0, 0, W, H);

      // フェード完了
      if (retryFade.timer >= retryFade.duration) {
        retryFade.active = false;
        bgmSyncToMode('field'); // 完全に明るくなってからBGM開始
      }
    }

  } else if (mode==='flash') {
    flash.timer++; flash.phase=Math.floor(flash.timer/5);
    if (flash.timer<flash.duration) {
      renderField();
      if (flash.phase%2===0) {
        // ボスフラッシュは赤黒、通常は白黒
        const fc = flash.isBoss ? 'rgba(255,0,0,0.5)' : 'rgba(255,255,255,0.9)';
        ctx.fillStyle=fc; ctx.fillRect(0,0,W,H);
      }
      ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(0,0,W,H);
    } else {
      if (flash.isBoss) { flash.isBoss=false; startBossBattle(); }
      else              { startBattle(); }
    }

  } else if (mode==='battle') {
    updateEffects(dt);
    if (battle.phase==='typing') {
      if (performance.now()-battle.typingStart>=battle.typingLimit) {
        seTypingFail(); // 時間切れSE
        battle.message='時間切れ！ダメージ0！';
        setBattleMessage(battle.message,true);
      }
    }
    if (battle.messageTimer>0) {
      battle.messageTimer--;
      if (battle.messageTimer===0) {
        if (battle.phase==='result_player') {
          if (enemy.hp<=0) {
            const gain=Math.round(enemy.baseExp*(1+(enemy.lv-1)*0.2));
            lastExpGain=gain; player.exp+=gain; lastLevelUp=tryLevelUp();
            // コインドロップ（Lvスケール＋ランダム変動）
            const baseCoin = enemy.coinDrop || 5;
            const coin = Math.round(baseCoin * (1+(enemy.lv-1)*0.25) * (0.8+Math.random()*0.4));
            lastCoinGain = coin;
            player.coins += coin;
            // ボス撃破 → ゲームクリア
            if (enemy.isBoss) {
              BOSS_EVENT.isDefeated = true;
              gameclearTimer = 0;
              mode = 'gameclear';
              bgmSyncToMode('gameclear');
            } else {
              mode='victory'; bgmSyncToMode('victory');
            }
          } else if (battle.enemyPending) { enemyAttack(); }
          else { battle.phase='command'; }
        } else if (battle.phase==='result_enemy') {
          if (player.hp<=0) { mode='gameover'; bgmSyncToMode('gameover'); }
          else { battle.phase='command'; battle.message=''; }
        } else if (battle.phase==='command') { battle.message=''; }
      }
    }
    renderBattle();
    if (mode==='victory') { renderBattle(); drawResultScreen(true); }
    else if (mode==='gameover') { renderBattle(); drawResultScreen(false); }

  } else if (mode==='victory') {
    renderBattle(); drawEffects(); drawResultScreen(true);
  } else if (mode==='gameover') {
    renderBattle(); drawEffects(); drawResultScreen(false);
  } else if (mode==='gameclear') {
    gameclearTimer++;
    drawGameClear(gameclearTimer);
  }

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
